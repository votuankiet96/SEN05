# config.yaml — nơi DUY NHẤT bạn cần sửa để thay đổi lựa chọn triển khai
# backtest/optimize (chiến lược nào, tham số nào được phép thử, mức nào,
# thiết lập engine cTrader dùng, luật FTMO để chấm điểm). KHÔNG chứa logic —
# chỉ dữ liệu. Người đọc/sửa file này: configuration.py (bo_workflow/
# core_engine/configuration.py).
#
# Gộp 2026-09-12 từ 4 file JSON cũ (profiles/strategy/combo-v1.json,
# profiles/strategy/macross-v1.json, profiles/engine/ctrader-5.9.16-ticks-
# approxfx-v1.json, profiles/ftmo/ftmo-2step-v1.json) — không đổi giá trị nào,
# chỉ đổi định dạng + gộp vào 1 chỗ.

schema: bo-cli-engine-config/v1

# ---------------------------------------------------------------------------
# redis: kết nối Redis nguồn tín hiệu (thay CSV), do strategy_lab (SEN05)
# cấp — key List+Hash {key_prefix}_{SYMBOL}_{TF}_{STRATEGY}.
# CHỈ chứa đường dẫn file mật khẩu (pwd_file) — KHÔNG BAO GIỜ chứa mật khẩu
# thật ở đây, cùng nguyên tắc với auth CLI (.ctrader-cli-pwd.txt). ĐÂY LÀ FILE
# VÍ DỤ (config.example.yaml) — copy thành config.yaml rồi điền host/pwd_file
# thật của bạn; config.yaml thật đã bị .gitignore, không push lên git.
#
# [2026-09-26] 2 profile cùng server/mật khẩu, chỉ khác db + key_prefix —
# strategy_lab publish song song 2 kênh đối chứng (xem worker.py bên
# og_program): kênh gốc = signal không lọc trend, kênh trend = cùng chiến lược
# nhưng chỉ giữ tín hiệu cùng chiều trend khung lớn (H4). Đổi kênh đọc cho 1
# experiment = đổi "redis_profile" trong config của nó, KHÔNG sửa code.
# [2026-10-08] Số DB THẬT (dò Redis): db0 = kênh gốc (key L_PastSignal_*), db1 =
# kênh trend (key L_PastSignal_Trend_*), db2..db5 trống. Trước đây ghi DB2/DB3 —
# hai tên đó còn trong nhãn dashboard và nhiều ghi chú cũ, chỉ là tên kênh.
# ---------------------------------------------------------------------------
redis:
  sen05-signal-v1:
    host: "<YOUR-REDIS-HOST>"
    port: 6379
    db: 0
    username: ""
    pwd_file: C:\path\to\.redis-signal-pwd.txt
    key_prefix: "L_PastSignal"

  sen05-signal-trend-v1:
    host: "<YOUR-REDIS-HOST>"
    port: 6379
    db: 1
    username: ""
    pwd_file: C:\path\to\.redis-signal-pwd.txt
    key_prefix: "L_PastSignal_Trend"

# ---------------------------------------------------------------------------
# strategies: mỗi chiến lược (Combo, MA Cross...) khai .algo, khung mặc định,
# và bảng tham số — "optimize: true" nghĩa là tham số ĐƯỢC PHÉP đưa vào lưới
# quét; đổi false/true ở đây chính là chỗ bạn bật/tắt 1 tham số cho tối ưu.
# "levels" là các mức quét sẵn khi experiment đặt tham số đó = True.
# ---------------------------------------------------------------------------
strategies:
  combo-v1:
    strategy: combo
    cbot_name: Combo
    algo: Combo.algo
    signal_prefix: combo
    # Tên file signal = {signal_prefix}_{GROUP}_{TF}_{signal_label}_{signal_mode}.csv
    # (khuôn mới của core_python.export_cli từ 2026-09-13, thay cho "_signals.csv" cũ)
    #   signal_label: full_history | from_YYYYMMDD | to_YYYYMMDD | YYYYMMDD_YYYYMMDD
    #   signal_mode : nt = no_trend (signal gốc, mặc định)
    #                 tf_<trend_type>_<trend_tf> = đã lọc theo trend (vd tf_knn_H4)
    signal_label: full_history
    signal_mode: nt
    default_timeframes: [h1, h2, h3, h4]
    infra_params: [SignalFilePath]
    params:
      - name: KslLevel
        kind: enum
        enum: sl_fib
        default: Fib1000
        optimize: true
        # [2026-09-21] Bỏ `levels:` chép tay — enum sl_fib/tp_fib giờ mặc định
        # sweep TOÀN BỘ enum (nguồn duy nhất = SL_FIB_LEVELS/TP_FIB_LEVELS
        # trong configuration.py, đúng thứ tự mirror Combo.cs/MA Cross.cs).
        # Trước đây danh sách 10 giá trị bị chép NGUYÊN VĂN ở đây (2 nguồn
        # cùng 1 sự thật — lệch thứ tự = sai lệnh mà không báo lỗi). Muốn quét
        # tập con thì khai `levels: [Fib0618, Fib1000, ...]` như bình thường.
      - name: KtpLevel
        kind: enum
        enum: tp_fib
        default: Fib2618
        optimize: true
      - name: RiskPercent
        kind: float
        default: 1.0
        optimize: true
        levels: [0.5, 1.0, 1.5, 2.0]
      - name: EnableDailyLossLimit
        kind: bool
        default: false
        optimize: false
      - name: MaxDailyLossPercent
        kind: float
        default: 5.0
        optimize: false
      - name: EnableMaxDrawdown
        kind: bool
        default: false
        optimize: false
      - name: MaxTotalDrawdownPercent
        kind: float
        default: 10.0
        optimize: false
      - name: EnableMaxConsecutiveLosses
        kind: bool
        default: false
        optimize: false
      - name: MaxConsecutiveLosses
        kind: int
        default: 5
        optimize: false

  macross-v1:
    strategy: macross
    cbot_name: MA Cross
    algo: MA Cross.algo
    signal_prefix: ma_cross
    signal_label: full_history
    signal_mode: nt
    default_timeframes: [m10, m20, m30, m45]   # khớp bộ signal ma_cross_<GROUP>_M{10,20,30,45}_...
    infra_params: [SignalFilePath]
    params:
      - name: KslLevel
        kind: enum
        enum: sl_fib
        default: Fib1000
        optimize: true
        # Xem giải thích đầy đủ ở block KslLevel của combo-v1 phía trên.
      - name: KtpLevel
        kind: enum
        enum: tp_fib
        default: Fib2618
        optimize: true
      - name: RiskPercent
        kind: float
        default: 1.0
        optimize: true
        levels: [0.5, 1.0, 1.5, 2.0]
      - name: EnableDailyLossLimit
        kind: bool
        default: false
        optimize: false
      - name: MaxDailyLossPercent
        kind: float
        default: 5.0
        optimize: false
      - name: EnableMaxDrawdown
        kind: bool
        default: false
        optimize: false
      - name: MaxTotalDrawdownPercent
        kind: float
        default: 10.0
        optimize: false
      - name: EnableMaxConsecutiveLosses
        kind: bool
        default: false
        optimize: false
      - name: MaxConsecutiveLosses
        kind: int
        default: 5
        optimize: false

  macdbreak-v1:
    strategy: macdbreak
    cbot_name: MACD Break
    algo: MACD Break.algo
    signal_prefix: macd_break
    signal_label: full_history
    signal_mode: nt
    default_timeframes: [h1, h2, h3, h4, m10, m20, m30, m45]   # khớp bộ signal Redis MACD_BREAK (11 symbol × 8 khung)
    infra_params: [SignalFilePath]
    params:
      - name: KslLevel
        kind: enum
        enum: sl_fib
        default: Fib1000
        optimize: true
      - name: KtpLevel
        kind: enum
        enum: tp_fib
        default: Fib2618
        optimize: true
      - name: RiskPercent
        kind: float
        default: 1.0
        optimize: true
        levels: [0.5, 1.0, 1.5, 2.0]
      - name: EnableDailyLossLimit
        kind: bool
        default: false
        optimize: false
      - name: MaxDailyLossPercent
        kind: float
        default: 5.0
        optimize: false
      - name: EnableMaxDrawdown
        kind: bool
        default: false
        optimize: false
      - name: MaxTotalDrawdownPercent
        kind: float
        default: 10.0
        optimize: false
      - name: EnableMaxConsecutiveLosses
        kind: bool
        default: false
        optimize: false
      - name: MaxConsecutiveLosses
        kind: int
        default: 5
        optimize: false

# ---------------------------------------------------------------------------
# engines: thiết lập kỹ thuật khi chạy backtest — data_mode (ticks/m1...), có
# bật quy đổi tỷ giá lịch sử hay không, chi phí giao dịch giả lập, VÀ (mới
# 2026-09-17) engine nào thi hành thật: "cli" (spawn ctrader-cli.exe, xem
# cli_engine/cli_runner.py) hoặc "api" (Plugin cTrader Desktop qua bridge, xem
# api_engine/api_runner.py — cần Desktop đang mở + plugin BoBacktestRunner
# bật). Đây là phần "máy chạy thế nào", KHÔNG phải "chiến lược nào" — tách hẳn
# khỏi strategies ở trên.
# Phiên bản ctrader-cli KHÔNG khai ở đây: dùng bản cTrader Desktop mới nhất chạy được, phiên bản thật
# ghi ở execution.json của từng run. Số phiên bản trong id (5.9.16) chỉ là tên lịch sử, không ràng buộc CLI.
# ---------------------------------------------------------------------------
engines:
  ctrader-5.9.16-ticks-approxfx-v1:
    backend: cli
    data_mode: ticks
    precise_conversion: false
    commission: null
    commission_type: null
    commission_auto: false
    spread: null
    notes: >-
      GUI parity profile: server ticks, approximate conversion, default
      broker cost model.

  ctrader-5.9.16-ticks-comm30-v1:
    backend: cli
    data_mode: ticks
    precise_conversion: false
    commission: 30
    # Phí PHẲNG 30 USD cho mỗi triệu USD khối lượng, áp cho MỌI symbol (CLI 5.9.16 chỉ có cờ
    # --commission=<số>, đơn vị mặc định UsdPerMillionUsdVolume, nên KHÔNG khai commission_type).
    # KHÔNG phải profile GUI-parity: phí thật của tài khoản là cấp TỪNG symbol (xem notes).
    commission_type: null
    commission_auto: false
    spread: null
    notes: >-
      Chỉ để stress-test chủ động với phí phẳng 30 USD/triệu. Ghi chú cũ "JP225 GUI tính
      phí 30 nên cần profile này" là HIỂU NHẦM (đã gỡ 2026-10-08): phí thật theo từng
      symbol, chỉ số .cash = 0 nên profile mặc định (phí 0) đã đúng với chỉ số. Muốn phí
      thật cho vàng/BTC/forex dùng profile commauto của CLI 5.10 bên dưới. Luôn đọc phí
      của TỪNG symbol trong usedSymbols của report (main.commissions chỉ ghi cấu hình tay).

  # --- CLI 5.10.x: 2 công tắc mà 5.9.16 KHÔNG có. Mỗi profile dưới đây chỉ lật ĐÚNG 1 công tắc so với
  # profile GUI-parity ở trên, để A/B tách được tác động của từng cái. Đã đo 2026-10-08: 5.10.16 ở chế độ
  # mặc định khớp 5.9.16 từng bit (US30 H1, JP225 H4), nên chênh lệch thấy được là do công tắc, không do
  # phiên bản. Cần CLI >= 5.10: cổng capability của cli_runner chặn nếu binary không có cờ.
  ctrader-ticks-approxfx-commauto-v1:
    backend: cli
    data_mode: ticks
    precise_conversion: false
    commission: null
    commission_type: null
    commission_auto: true
    spread: null
    notes: >-
      Phí lấy thẳng từ cấu hình TỪNG symbol trên server (--commission-auto) — cách đúng để có
      phí thật, thay cho nhập tay (comm30). Đo 2026-10-08: chỉ số .cash = 0 (JP225), BTCUSD
      0,0325% MỖI CHIỀU tính trên khối lượng lúc vào và lúc ra. Ghi nhận 2026-09-25: XAUUSD
      0,0007% khối lượng, forex 2,5 USD/lot theo cấu hình symbol. Tỷ giá quy đổi vẫn xấp xỉ
      như profile GUI-parity.

  ctrader-ticks-precisefx-v1:
    backend: cli
    data_mode: ticks
    precise_conversion: true
    commission: null
    commission_type: null
    commission_auto: false
    spread: null
    notes: >-
      Bật --precise-conversion: P&L, swap và margin của symbol có quote khác tiền ký quỹ (JPY, HKD,
      GBP, EUR) quy đổi bằng tỷ giá LỊCH SỬ THẬT thay vì 1 tỷ giá hằng số cho cả kỳ (đo JP225 H4:
      tắt = USDJPY 160,12 cho mọi lệnh, bật = 152,65 tới 163,81). Chậm hơn khoảng 15-20%. Phí vẫn mặc
      định như profile GUI-parity; ghép cả 2 công tắc là một profile khác, chưa tạo.

  ctrader-api-plugin-v1:
    backend: api
    data_mode: ticks
    precise_conversion: false
    commission: null
    commission_type: null
    commission_auto: false
    spread: null
    notes: >-
      Đi qua Plugin BoBacktestRunner (api_engine/) thay vì spawn ctrader-cli.exe
      — dùng phiên đăng nhập Desktop có sẵn, không tự xác thực mới mỗi lần chạy.
      Cần cTrader Desktop đang mở + plugin bật trước khi dùng profile này. Chưa
      chạy batch lớn thật nào qua profile này — xác nhận bằng lô nhỏ trước.

# ---------------------------------------------------------------------------
# ftmo: luật lỗ ngày/lỗ tổng dùng để chấm điểm kết quả backtest có vi phạm
# luật FTMO hay không (selection.ftmo_screen). KHÔNG phải tham số bot.
# ---------------------------------------------------------------------------
ftmo:
  ftmo-2step-v1:
    timezone: Europe/Prague
    initial_balance: 100000
    daily_loss_pct: 5.0
    max_loss_pct: 10.0
    max_loss_type: static
    daily_loss_base: start_of_day_balance
    source: "User to verify against current FTMO rules before production use."
