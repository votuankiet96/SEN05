# config.yaml — nơi DUY NHẤT bạn cần sửa để thay đổi lựa chọn triển khai
# backtest/optimize (chiến lược nào, tham số nào được phép thử, mức nào,
# thiết lập engine cTrader dùng, luật FTMO để chấm điểm). KHÔNG chứa logic —
# chỉ dữ liệu. Người đọc/sửa file này: configuration.py (bo_workflow/
# core_engine/configuration.py).
#
# Gộp 2026-09-12 từ 4 file JSON cũ (profiles/strategy/combo-v1.json,
# profiles/strategy/macross-v1.json, profiles/engine/ctrader-5.9.16-ticks-
# approxfx-v1.json, profiles/ftmo/ftmo-2step-v1.json) — không đổi giá trị nào,
# chỉ đổi định dạng + gộp vào 1 chỗ.

schema: bo-cli-engine-config/v1

# ---------------------------------------------------------------------------
# redis: kết nối Redis nguồn tín hiệu (thay CSV), do strategy_lab (SEN05)
# cấp — key List+Hash {key_prefix}_{SYMBOL}_{TF}_{STRATEGY}.
# CHỈ chứa đường dẫn file mật khẩu (pwd_file) — KHÔNG BAO GIỜ chứa mật khẩu
# thật ở đây, cùng nguyên tắc với auth CLI (.ctrader-cli-pwd.txt). ĐÂY LÀ FILE
# VÍ DỤ (config.example.yaml) — copy thành config.yaml rồi điền host/pwd_file
# thật của bạn; config.yaml thật đã bị .gitignore, không push lên git.
#
# [2026-10-23] WE (OG8) cấp 3 nguồn tín hiệu CỐ ĐỊNH, cùng server/mật khẩu, mỗi DB + tiền tố giữ MỘT nghĩa không bao
# giờ đổi (kiểu lọc mới sau này sẽ lấy DB/tiền tố mới, không dùng lại tên cũ): db0 = RAW (setup -> lọc lặp cùng chiều,
# không lọc trend), db1 = KNN (RAW rồi chỉ giữ tín hiệu cùng chiều trend KNN, khung tham chiếu riêng theo ô), db2 = BRK
# (trend breakout cùng khung tín hiệu + luật dời tín hiệu). Tiền tố cũ `L_PastSignal_Trend` từng đổi nội dung
# KNN <-> breakout nên đã bỏ; profile cũ `sen05-signal-trend-v1` đã bỏ (kết quả cũ mang nhãn đó chỉ còn là lịch sử).
# [2026-10-24] Nguồn thứ 4 theo đúng nguyên tắc trên (DB + tiền tố MỚI): db4 = ZIGZAG (lọc theo trend zigzag; đo 24/10:
# tập con thuần của db0, nội dung y hệt, giữ ~48%).
# `label` = nhãn nguồn ghi vào kho SQL (signal_snapshot.channel), khai tường minh, không suy từ tiền tố.
# Một lượt chạy chọn nguồn MẶC ĐỊNH bằng `redis_profile`; từng channel có thể đè bằng `source` (đa nguồn trong một lượt).
# ---------------------------------------------------------------------------
redis:
  sen05-signal-v1:
    host: "<YOUR-REDIS-HOST>"
    port: 6379
    db: 0
    username: ""
    pwd_file: C:\path\to\.redis-signal-pwd.txt
    key_prefix: "L_PastSignal"
    label: original

  sen05-signal-knn-v1:
    host: "<YOUR-REDIS-HOST>"
    port: 6379
    db: 1
    username: ""
    pwd_file: C:\path\to\.redis-signal-pwd.txt
    key_prefix: "L_PastSignal_Knn"
    label: knn

  sen05-signal-breakout-v1:
    host: "<YOUR-REDIS-HOST>"
    port: 6379
    db: 2
    username: ""
    pwd_file: C:\path\to\.redis-signal-pwd.txt
    key_prefix: "L_PastSignal_Breakout"
    label: breakout

  sen05-signal-zigzag-v1:
    host: "<YOUR-REDIS-HOST>"
    port: 6379
    db: 4
    username: ""
    pwd_file: C:\path\to\.redis-signal-pwd.txt
    key_prefix: "L_PastSignal_Zigzag"
    label: zigzag

backtest:
  defaults:
    strategy: backtestbot
    strategy_profile: backtestbot-v1
    engine_profile: ctrader-ticks-precisefx-v1
    redis_profile: sen05-signal-v1
    account_mode: isolated
    period_group: from2022
    balance: 100000
    fixed_params:
      KslLevel: Fib2618
      KtpLevel: Fib2618
      Leg2Ktp: Fib3330
      Leg3Ktp: Fib4236
      LegCount: 3
      RiskPercent: 1.0
  period_groups:
    from2022:
      start_year: 2022
      cutoff: 2026-06-30
  runner:
    max_parallel: 16
  # Phân bổ rủi ro Multi-channel (tài khoản chung): total_risk_percent = hạn mức TỔNG rủi ro mỗi cụm lệnh khi mọi channel
  # cùng mở (mỗi channel chỉ có tối đa 1 cụm mở cùng lúc). Chia đều: mỗi channel = hạn mức / N, làm tròn XUỐNG
  # risk_decimals chữ số. Cặp này KHÔNG nằm trong run_key; run_key chỉ chứa risk_percent từng channel.
  portfolio:
    total_risk_percent: 2.0
    risk_decimals: 4

# ---------------------------------------------------------------------------
# ctrader: nơi cTrader tự ghi 1 thư mục kết quả cho mỗi lần chạy CLI
# (<sha256 .algo>\<guid>\Backtesting\{events.json, log.txt, report.html, ...}).
# Pipeline CHỈ ĐỌC từ đây để chép events.json (vòng đời lệnh) về kho — không ghi, không xoá.
# ---------------------------------------------------------------------------
ctrader:
  data_dir: "%USERPROFILE%\\Documents\\cAlgo\\Data\\cBots"

# ---------------------------------------------------------------------------
# master_db: kho SQL master kết quả backtest (SQL Server Express, cùng máy).
# Thiết kế: research_notes/sql-master-database-plan-2026-10-14.md. Đăng nhập Windows —
# KHÔNG có mật khẩu. enabled=false → pipeline không ghi SQL (file vẫn là nguồn sự thật).
# ---------------------------------------------------------------------------
master_db:
  enabled: false
  server: "localhost\\SQLEXPRESS"
  database: bo_research
  driver: "ODBC Driver 18 for SQL Server"

# ---------------------------------------------------------------------------
# strategies: mỗi profile (nay chỉ còn backtestbot-v1, chạy cả 3 chiến lược) khai .algo, khung mặc định,
# và bảng tham số — "optimize: true" nghĩa là tham số ĐƯỢC PHÉP đưa vào lưới
# quét; đổi false/true ở đây chính là chỗ bạn bật/tắt 1 tham số cho tối ưu.
# "levels" là các mức quét sẵn khi experiment đặt tham số đó = True.
# ---------------------------------------------------------------------------
strategies:

  # [2026-10-16] BacktestBot: bot DUY NHẤT chạy nhiều CHIẾN LƯỢC × nhiều SYMBOL × nhiều KHUNG trên 1 tài khoản backtest,
  # thay ComboMulti / MACrossMulti / MACDBreakMulti. Kiểu lệnh do chiến lược quyết định (combo = lệnh STOP có entry,
  # ma_cross / macd_break = lệnh MARKET). `strategy_frames` = danh mục chiến lược (token Redis) và khung mặc định của
  # từng chiến lược. Cấu hình lần chạy BẮT BUỘC khai `signal_strategies: [combo, ...]` (chọn chiến lược) và có thể thu
  # hẹp bằng `signal_symbols` / `signal_timeframes`; thiếu signal_strategies là LỖI, không bao giờ chạy cả 3 ngầm.
  # Nhãn lệnh <mã>_<symbol rút gọn>_<TF>_L<n> (vd cb_US30_H1_L1). 14 tham số, thứ tự enum và mặc định giống hệt ComboMulti.
  backtestbot-v1:
    strategy: backtestbot
    cbot_name: BacktestBot
    algo: BacktestBot.algo
    source: BacktestBot/BacktestBot/BacktestBot.cs
    signal_prefix: backtestbot
    default_timeframes: [h1]
    strategy_frames:
      combo: [H1, H2, H3, H4]
      ma_cross: [M10, M20, M30, M45]
      macd_break: [H1, H2, H3, H4, M10, M20, M30, M45]
    infra_params: [SignalFilePath]
    params:
      - name: KslLevel
        kind: enum
        enum: sl_fib
        default: Fib1618
        optimize: true
      - name: KtpLevel
        kind: enum
        enum: tp_fib
        default: Fib2618
        optimize: true
      - name: LegCount
        kind: int
        default: 1
        optimize: false
      - name: Leg2Ktp
        kind: enum
        enum: tp_fib
        default: Fib3330
        optimize: false
      - name: Leg3Ktp
        kind: enum
        enum: tp_fib
        default: Fib4236
        optimize: false
      - name: RiskPercent
        kind: float
        default: 0.2
        optimize: true
        levels: [0.5, 1.0, 1.5, 2.0]
      - name: EnableDailyLossLimit
        kind: bool
        default: false
        optimize: false
      - name: MaxDailyLossPercent
        kind: float
        default: 5.0
        optimize: false
      - name: EnableMaxDrawdown
        kind: bool
        default: false
        optimize: false
      - name: MaxTotalDrawdownPercent
        kind: float
        default: 10.0
        optimize: false
      - name: EnableMaxConsecutiveLosses
        kind: bool
        default: false
        optimize: false
      - name: MaxConsecutiveLosses
        kind: int
        default: 5
        optimize: false

# ---------------------------------------------------------------------------
# engines: thiết lập kỹ thuật khi chạy backtest — "máy chạy thế nào", KHÔNG phải "chiến lược nào" (tách hẳn khỏi strategies
# ở trên). Mỗi trường dịch thẳng sang cờ ctrader-cli (core_engine/cli_runner.py); null/false = KHÔNG truyền cờ, cTrader dùng
# mặc định. Chỉ dùng MỘT bộ (quyết định 2026-10-22): muốn đổi công tắc thì sửa ngay các dòng bên dưới. Tên bộ và giá trị công
# tắc đều nằm trong danh tính (run_key) của lượt chạy: GIỮ NGUYÊN TÊN (đổi tên làm mọi kết quả cũ thành "chưa chạy"); đổi công
# tắc thì lượt mới có run_key mới, nhưng cột engine_profile trong SQL vẫn cùng tên.
# backend: chỉ còn "cli" (spawn ctrader-cli.exe, xem core_engine/cli_runner.py); engine "api" (Plugin qua bridge) đã xoá
# 2026-10-13. Phiên bản ctrader-cli KHÔNG khai ở đây: dùng bản cTrader Desktop mới nhất chạy được, phiên bản thật ghi ở
# execution.json của từng run.
# ---------------------------------------------------------------------------
engines:
  ctrader-ticks-precisefx-v1:
    backend: cli
    data_mode: ticks
    precise_conversion: true
    commission: null
    commission_type: null
    commission_auto: false
    spread: null
    notes: >-
      Tick của server. precise_conversion = --precise-conversion: P&L, swap và margin của symbol có quote khác tiền ký quỹ
      (JPY, HKD, GBP, EUR) quy đổi bằng tỷ giá LỊCH SỬ THẬT thay vì 1 tỷ giá hằng số cho cả kỳ (đo JP225 H4: tắt = USDJPY
      160,12 cho mọi lệnh, bật = 152,65 tới 163,81); chậm hơn khoảng 15-20%, cần CLI >= 5.10 (cổng capability của cli_runner
      chặn nếu binary thiếu cờ). commission / commission_type / commission_auto / spread để mặc định nên PHÍ = 0 và không ép
      spread (report ghi commissions.value 0, spread None; đã kiểm 2026-10-22: mọi lệnh trong SQL có commission 0). Muốn phí
      thật theo từng symbol: commission_auto: true (--commission-auto, không đi chung commission/commission_type); đo
      2026-09-25 và 2026-10-08: chỉ số .cash = 0, BTCUSD 0,0325% MỖI CHIỀU, XAUUSD 0,0007% khối lượng, forex 2,5 USD/lot.
      Phí phẳng: commission (+ commission_type). Spread cố định: spread (pips). Phí của TỪNG symbol đọc ở usedSymbols của
      report (main.commissions chỉ ghi cấu hình tay).

# ---------------------------------------------------------------------------
# ftmo: luật lỗ ngày/lỗ tổng dùng để chấm điểm kết quả backtest có vi phạm
# luật FTMO hay không (selection.ftmo_screen). KHÔNG phải tham số bot.
# ---------------------------------------------------------------------------
ftmo:
  ftmo-2step-v1:
    timezone: Europe/Prague
    initial_balance: 100000
    daily_loss_pct: 5.0
    max_loss_pct: 10.0
    max_loss_type: static
    daily_loss_base: start_of_day_balance
    source: "User to verify against current FTMO rules before production use."
