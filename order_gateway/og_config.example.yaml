redis:
  enabled: true
  host: "127.0.0.1"       # Redis replica AEN trên og18: DB0 nến vào, DB1 tín hiệu ra
  password: ""
  input:
    db: 0
    key_prefix: "L_CANDLE"
    snapshot_bars: 500
    process_on_startup: true
  output:
    db: 1
    key_prefix: "L_OG"            # OG LIST/HASH: L_OG_{STRATEGY}_{SYMBOL}_{TF}[:stamp]
    channel_prefix: "L_CHANNEL"   # Kênh Pub/Sub OG -> OF (chỉ là đường truyền, không lưu key nào): L_CHANNEL_{STRATEGY}_{SYMBOL}_{TF}

live:
  enabled_strategies: [combo, ma_cross]
  log_level: INFO
  discord:
    enabled: false
    webhook_url: ""
    username: "OG Signal"
    timeout_seconds: 10
    retry_count: 2
    retry_delay_seconds: 2
  signal_validity:
    combo:
      mode: next_bar
      valid_bars: 3
    ma_cross:
      mode: seconds_after_bar_close
      seconds: 600  # AEN M45 (dong luc :15/:45) ghi cham deu ~310-373s -- 180s cu qua ngan

strategies:
  combo:
    ma_period: 20
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    recommended_timeframes: [H1, H2, H3, H4]
    default_timeframe: H4
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
    symbol_x:
      US30: 10.0
      US500: 1.0
      US100: 5.0
      GER40: 5.0
      HK50: 15.0
      JP225: 15.0
      XAUUSD: 0.5
      BTCUSD: 50.0
    session_hours_utc: {}

  ma_cross:
    fast_ma: 13
    slow_ma: 34
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    supported_timeframes: [M10, M20, M30, M45]
    default_timeframe: M30
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
