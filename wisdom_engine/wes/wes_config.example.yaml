# wes (WE Simulator) -- cấu hình MẪU, không chứa bí mật.
# Sao chép thành wes_config.yaml (file thật bị gitignore) rồi điền mật khẩu Redis.
#
# wes nhận nến do DFS (Datafeed Simulator) phát lên Redis db14, chạy đúng luồng OG
# (combo / ma_cross / macd_break), rồi ghi tín hiệu ra db15. Hai khác biệt hành vi so với OG live:
# (1) KHÔNG có hết hạn -- không cửa sổ hiệu lực, không TTL, không cắt bớt LIST (quyết định
# 2026-10-07), nên mọi tín hiệu tìm được trên nến phát lại đều được giữ lại;
# (2) mỗi lần START wes xoá sạch các key {output.key_prefix}_* ở db đầu ra (quyết định 2026-10-08).

redis:
  enabled: true
  host: "127.0.0.1"       # Redis OG8 (cùng máy với wes)
  password: ""            # điền ở wes_config.yaml thật, KHÔNG điền ở bản mẫu
  input:
    db: 14                # db DFS ghi nến vào: LIST L_DFS_{SYMBOL}_{TF} + HASH ...:{stamp}
    key_prefix: "L_DFS"
    snapshot_bars: 500    # DFS giữ 1200 nến/cặp nên đủ
    process_on_startup: false   # false: không quét lại mọi cặp lúc khởi động (seed của DFS sinh ~198k event)
  output:
    db: 15                # db wes ghi tín hiệu: L_WES_{STRATEGY}_{SYMBOL}_{TF}[:stamp] (không TTL, không cắt)
    key_prefix: "L_WES"
    channel_prefix: "L_CHANNEL_SIM"   # kênh Pub/Sub (chỉ là đường truyền): L_CHANNEL_SIM_{STRATEGY}_{SYMBOL}_{TF}
                                      # đặt khác "L_CHANNEL" để tín hiệu mô phỏng không lọt vào kênh của OG live

live:
  enabled_strategies: [combo, ma_cross, macd_break]
  log_level: INFO
  discord:
    enabled: false        # mô phỏng: TUYỆT ĐỐI không dùng webhook thật
    webhook_url: ""
    username: "OG Signal"
    timeout_seconds: 10
    retry_count: 2
    retry_delay_seconds: 2

strategies:
  combo:
    ma_period: 20
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    recommended_timeframes: [H1, H2, H3, H4]
    default_timeframe: H4
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    alternating_filter_enabled: true   # true = chi ban tin hieu dau tien khi huong doi chieu (loc lap cung chieu); false = bar nao thoa dieu kien cung ban
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
    symbol_x:                     # tên SYMBOL theo SQL/DFS (không phải tên AEN), cùng giá trị X với wisdom_engine
      US30: 10.0
      US500: 1.0
      US100: 5.0
      DE40: 5.0
      UK100: 5.0
      FR40: 5.0
      SP35: 5.0
      HK50: 15.0
      J225: 15.0
      GOLD: 0.5
      BTCUSD: 50.0
    session_hours_utc: {}

  ma_cross:
    fast_ma: 13
    slow_ma: 34
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    supported_timeframes: [M10, M20, M30, M45]
    default_timeframe: M30
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4

  macd_break:
    lookback_bars: 100        # đỉnh/đáy close của N nến trước (tối đa 300; wes đọc 500 nến mỗi sự kiện)
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5             # xuất cột atr để OF tính SL/TP (KSL/KTP)
    supported_timeframes: [M10, M20, M30, M45, H1, H2, H3, H4]
    default_timeframe: H1
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    alternating_filter_enabled: true   # true = chi ban tin hieu dau tien khi huong doi chieu (loc lap cung chieu); false = bar nao thoa dieu kien cung ban
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
