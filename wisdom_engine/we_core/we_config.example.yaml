      USDCAD: {H1: H4, H2: H2, H3: H3, H4: H4}
    symbol_x:
      US30: 10.0
      US500: 1.0
      US100: 5.0
      DE40: 5.0
      UK100: 5.0
      FR40: 5.0
      SP35: 5.0
      HK50: 15.0
      J225: 15.0
      GOLD: 0.5
      BTCUSD: 50.0
    # Nhóm symbol dùng entry theo ATR thay X cố định (đơn vị %): BUY = high + a% × ATR(atr_period), SELL = low − a% × ATR tại nến tín hiệu.
    # Mỗi symbol đúng MỘT kiểu đệm: symbol_x (X cố định) HOẶC symbol_entry_atr_pct. Cả hai nhóm đều là symbol vận hành (cả ba chiến lược).
    symbol_entry_atr_pct:
      EURUSD: 5.0
      USDJPY: 5.0
      GBPUSD: 5.0
      USDCAD: 5.0
    session_hours_utc: {}

