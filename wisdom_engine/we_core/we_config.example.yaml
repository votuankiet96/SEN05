sql:
  server: 10.11.12.6
  database: SEN05_AutoTrading
  uid: sa
  pwd: "CHANGE_ME"

redis:
  host: "127.0.0.1"       # Redis chạy cùng máy OG8
  password: "CHANGE_ME"
  # --- Past-signal (we_core), xem CLAUDE.md mục 5 và 7 ---
  # redis_io/ đọc đúng 3 mục dưới đây (backfill_event, past_signal,
  # past_signal_trend; client.py: normalize_redis_config bắt buộc đủ key con,
  # không fallback). Không có mục input/output hay live như order_gateway cũ --
  # wisdom_engine không đọc nến từ Redis (đọc SQL) và không publish theo
  # schema OF, nên các phần đó bị bỏ hẳn khi viết lại redis_io/, không phải
  # sót lại.
  backfill_event:
    channel: "df:events:backfill"      # kênh nghe trigger "SQL vừa backfill xong" từ DF
  past_signal:
    db: 0                              # DB0 -- Redis OG8 chỉ dành cho wisdom_engine. Không lọc trend
    key_prefix: "L_PastSignal"
  past_signal_trend:
    db: 1                              # DB1 -- Redis OG8 chỉ dành cho wisdom_engine. CÓ lọc trend
    key_prefix: "L_PastSignal_Trend"   # -- đối chứng với past_signal, xem CLAUDE.md

defaults:
  symbol: BTCUSD
  bars: 500
  warmup_bars: 300
  signal_start_date: "2022-01-01"  # mốc bắt đầu tính signal cho luồng Redis
                                    # DB0 (redis_io/worker.py) -- áp dụng cho
                                    # cả bootstrap lúc start/reconnect lẫn
                                    # trigger thật từ df:events:backfill, để
                                    # 2 đường luôn ra cùng 1 kết quả nhất
                                    # quán cho cùng 1 pair. KHÔNG áp dụng cho
                                    # export_cli.py (CSV vẫn full-history mặc
                                    # định trừ khi tự truyền --from).
  price_decimals:                   # số chữ số thập phân của atr/entry khi xuất CSV/Redis; symbol không liệt kê = 2
    EURUSD: 5                       # symbol giá ~1 cần nhiều chữ số hơn (làm tròn 2 chữ số sẽ xoá mất đệm entry)
    GBPUSD: 5
    USDCAD: 5
    USDJPY: 3

strategies:
  combo:
    ma_period: 20
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    recommended_timeframes: [H1, H2, H3, H4]
    default_timeframe: H4
    trend_filter_enabled: false
    alternating_filter_enabled: true   # true = chỉ bắn tín hiệu đầu tiên khi hướng đổi chiều (lọc lặp cùng chiều); false = bar nào thỏa điều kiện cũng bắn
    trend_methods: [knn]   # khối xác nhận xu hướng khung lớn được bật (src/trend_methods/<tên>.py); nhiều khối = phải đồng thuận cả hai
    trend_timeframes: [H1, H2, H3, H4]
    trend_tf_by_symbol:   # khung trend RIÊNG cho từng (symbol, khung vào lệnh): symbol -> {khung vào: khung trend}; BẮT BUỘC đủ mọi symbol × khung vào lệnh (thiếu ô là lỗi lúc nạp config).
                          # Khung trend phải thuộc trend_timeframes và >= khung vào lệnh (kiểm lúc nạp config và lúc worker khởi động).
                          # Bảng do research_notes/scripts/t008_tune_trend_tf.py chọn theo SỐ tín hiệu nhiều nhất (2024-01-01 → 2026-10-16); sửa tay được.
      BTCUSD: {H1: H4, H2: H2, H3: H3, H4: H4}
      DE40: {H1: H4, H2: H2, H3: H3, H4: H4}
      FR40: {H1: H4, H2: H4, H3: H3, H4: H4}
      GOLD: {H1: H4, H2: H2, H3: H3, H4: H4}
      HK50: {H1: H4, H2: H2, H3: H3, H4: H4}
