sql:
  server: 10.11.12.6
  database: SEN05_AutoTrading
  uid: sa
  pwd: "CHANGE_ME"

redis:
  host: "127.0.0.1"       # Redis chạy cùng máy OG8
  password: "CHANGE_ME"
  # --- Past-signal (we_core), xem CLAUDE.md mục 5 và 7 ---
  # redis_io/ đọc đúng 3 mục dưới đây (backfill_event, past_signal,
  # past_signal_trend; client.py: normalize_redis_config bắt buộc đủ key con,
  # không fallback). Không có mục input/output hay live như order_gateway cũ --
  # wisdom_engine không đọc nến từ Redis (đọc SQL) và không publish theo
  # schema OF, nên các phần đó bị bỏ hẳn khi viết lại redis_io/, không phải
  # sót lại.
  backfill_event:
    channel: "df:events:backfill"      # kênh nghe trigger "SQL vừa backfill xong" từ DF
  past_signal:
    db: 0                              # DB0 -- Redis OG8 chỉ dành cho wisdom_engine. Không lọc trend
    key_prefix: "L_PastSignal"
  past_signal_trend:
    db: 1                              # DB1 -- Redis OG8 chỉ dành cho wisdom_engine. CÓ lọc trend
    key_prefix: "L_PastSignal_Trend"   # -- đối chứng với past_signal, xem CLAUDE.md

defaults:
  symbol: BTCUSD
  bars: 500
  warmup_bars: 300
  signal_start_date: "2022-01-01"  # mốc bắt đầu tính signal cho luồng Redis
                                    # DB0 (redis_io/worker.py) -- áp dụng cho
                                    # cả bootstrap lúc start/reconnect lẫn
                                    # trigger thật từ df:events:backfill, để
                                    # 2 đường luôn ra cùng 1 kết quả nhất
                                    # quán cho cùng 1 pair. KHÔNG áp dụng cho
                                    # export_cli.py (CSV vẫn full-history mặc
                                    # định trừ khi tự truyền --from).

strategies:
  combo:
    ma_period: 20
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    recommended_timeframes: [H1, H2, H3, H4]
    default_timeframe: H4
    trend_filter_enabled: false
    alternating_filter_enabled: true   # true = chỉ bắn tín hiệu đầu tiên khi hướng đổi chiều (lọc lặp cùng chiều); false = bar nào thỏa điều kiện cũng bắn
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
    symbol_x:
      US30: 10.0
      US500: 1.0
      US100: 5.0
      DE40: 5.0
      UK100: 5.0
      FR40: 5.0
      SP35: 5.0
      HK50: 15.0
      J225: 15.0
      GOLD: 0.5
      BTCUSD: 50.0
    session_hours_utc: {}

  ma_cross:
    fast_ma: 13
    slow_ma: 34
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    supported_timeframes: [M10, M20, M30, M45]
    default_timeframe: M30
    trend_filter_enabled: false
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4

  # MACD Break -- biến tấu từ mẫu breakout trong research_notes S005 (thêm
  # 2026-10-06): BUY khi close phá đỉnh close của lookback_bars nến trước VÀ MACD
  # Histogram > 0; SELL ngược lại. Không có logic thoát lệnh (thuộc hệ đặt lệnh).
  # Giá trị ban đầu CHƯA có căn cứ backtest.
  macd_break:
    lookback_bars: 100        # đỉnh/đáy close của N nến trước (tối đa = defaults.warmup_bars)
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5             # xuất cột atr cho hệ đặt lệnh tính SL/TP (KSL/KTP)
    supported_timeframes: [M10, M20, M30, M45, H1, H2, H3, H4]
    default_timeframe: H1
    trend_filter_enabled: false
    alternating_filter_enabled: true   # true = chỉ bắn tín hiệu đầu tiên khi hướng đổi chiều (lọc lặp cùng chiều); false = bar nào thỏa điều kiện cũng bắn
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4

  # SMA Trend -- chiến lược nghiên cứu (research_notes S005, thêm 2026-10-04), chỉ để
  # xem trên chart / export. Worker Redis KHÔNG chạy chiến lược này. Giá trị ban đầu
  # do người dùng duyệt để xem chart, CHƯA có căn cứ backtest.
  sma_trend:
    sma_period: 200           # nguồn: SMA 210 nến ngày (~10 tháng)
    allow_short: true         # chiều SELL đối xứng — không có trong nguồn
    supported_timeframes: [M10, M20, M30, M45, H1, H2, H3, H4]
    default_timeframe: H4
    state_warmup_start: "2025-01-01"   # chart chạy trạng thái từ mốc này rồi mới cắt cửa sổ hiển thị
