redis:
  enabled: true
  host: "127.0.0.1"       # Redis chạy cùng máy OG8
  password: "CHANGE_ME"
  input:
    db: 0
    key_prefix: "L_CANDLE"
    snapshot_bars: 500
    process_on_startup: true
  output:
    db: 1
    key_prefix: "L_SIGNAL"
    event_channel: "og:events:signals"

live:
  enabled_strategies: [combo, ma_cross]
  log_level: INFO
  discord:
    enabled: true
    webhook_url: "CHANGE_ME"  # Discord signal channel webhook URL
    username: "OG Signal"
    timeout_seconds: 10
    retry_count: 2
    retry_delay_seconds: 2
  signal_validity:
    combo:
      mode: next_bar
      valid_bars: 3
    ma_cross:
      mode: seconds_after_bar_close
      seconds: 180

strategies:
  combo:
    ma_period: 20
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    recommended_timeframes: [H1, H2, H3, H4]
    default_timeframe: H4
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
    symbol_x:
      US30: 10.0
      US500: 1.0
      US100: 5.0
      DE40: 5.0
      UK100: 5.0
      FR40: 5.0
      SP35: 5.0
      HK50: 15.0
      J225: 15.0
      GOLD: 0.5
      BTCUSD: 50.0
    session_hours_utc: {}

  ma_cross:
    fast_ma: 13
    slow_ma: 34
    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    supported_timeframes: [M10, M20, M30, M45]
    default_timeframe: M30
    trend_filter_enabled: false   # true = chi publish tin hieu cung chieu trend khung lon
    trend_type: knn
    trend_timeframes: [H1, H2, H3, H4]
    default_trend_tf: H4
