<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoTrading Chart</title>

  <!-- TradingView Lightweight Charts 4.2.1 -->
  <script src="https://unpkg.com/lightweight-charts@4.2.1/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    /* ── Reset & Base ───────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #131722;
      --bg2:    #1e222d;
      --bg3:    #2a2e39;
      --border: #363a45;
      --text:   #d1d4dc;
      --text2:  #787b86;
      --blue:   #2962ff;
      --green:  #26a69a;
      --red:    #ef5350;
      --sidebar-w: 240px;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      font-size: 13px;
      overflow: hidden;
    }

    /* ── Layout ─────────────────────────────────────────────────── */
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* Header */
    #header {
      display: flex; align-items: center; gap: 14px;
      background: var(--bg2);
      border-bottom: 1px solid var(--border);
      padding: 8px 16px;
      flex-shrink: 0;
      min-height: 40px;
    }
    #header-title { color: var(--text); font-weight: 700; font-size: 14px; white-space: nowrap; }
    #ohlc-bar     { margin-left: auto; font-family: monospace; font-size: 12px; color: var(--text2); }
    #refresh-badge {
      font-size: 11px; color: var(--text2);
      background: var(--bg3); padding: 2px 8px;
      border: 1px solid var(--border); border-radius: 10px;
      white-space: nowrap;
    }
    #status-msg { font-size: 11px; color: var(--text2); }
    #view-tabs { display: flex; gap: 4px; }
    .view-tab {
      background: var(--bg3); color: var(--text2);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 4px 9px; font-size: 12px; cursor: pointer;
    }
    .view-tab:hover { color: var(--text); border-color: var(--blue); }
    .view-tab.active { background: var(--blue); color: #fff; border-color: var(--blue); }
    .hidden { display: none !important; }

    /* Body row */
    #body { display: flex; flex: 1; overflow: hidden; }

    /* Sidebar */
    #sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--bg2);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      overflow: hidden; flex-shrink: 0;
    }
    #sidebar-scroll { overflow-y: auto; flex: 1; padding: 10px 8px; }

    /* Section labels */
    .section-label {
      color: var(--text2); font-size: 10px;
      text-transform: uppercase; letter-spacing: 1.2px;
      margin: 10px 2px 4px; display: block;
    }
    .section-label:first-child { margin-top: 0; }

    /* Symbol buttons */
    .sym-group { margin-bottom: 6px; }
    .sym-group-name {
      color: var(--text2); font-size: 9px;
      text-transform: uppercase; letter-spacing: 1px;
      margin: 8px 2px 3px; display: block;
    }
    .sym-buttons { display: flex; flex-wrap: wrap; gap: 2px; }
    .sym-btn {
      background: var(--bg3); color: var(--text2);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 4px 7px; font-size: 11px; cursor: pointer;
      transition: all 0.12s; white-space: nowrap;
    }
    .sym-btn:hover  { border-color: var(--blue); color: var(--text); }
    .sym-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 600; }

    /* TF buttons */
    #tf-buttons { display: flex; flex-wrap: wrap; gap: 2px; margin-bottom: 6px; align-items: center; }
    .tf-btn {
      background: var(--bg3); color: var(--text2);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 5px 9px; font-size: 12px; cursor: pointer;
      transition: all 0.12s; font-weight: 400;
    }
    .tf-btn:hover  { border-color: var(--blue); color: var(--text); }
    .tf-btn.active { background: var(--blue); color: #fff; border-color: var(--blue); font-weight: 700; }
    /* Nhãn phân tách nhóm TF */
    .tf-group-label {
      width: 100%; font-size: 9px; color: var(--text2);
      text-transform: uppercase; letter-spacing: 1px;
      margin: 5px 2px 2px; opacity: 0.7;
    }
    .tf-group-label:first-child { margin-top: 0; }

    /* Bars select */
    #bars-select {
      width: 100%; background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 4px 6px; font-size: 12px; cursor: pointer;
      margin-bottom: 6px; appearance: none;
    }
    #bars-select:focus { outline: none; border-color: var(--blue); }

    /* ── Indicator controls ─────────────────────────────────────── */
    #indicator-controls { display: flex; flex-direction: column; gap: 2px; margin-bottom: 4px; }
    .ind-block { background: var(--bg3); border-radius: 4px; padding: 5px 7px; }
    .ind-header {
      display: flex; align-items: center; gap: 6px; cursor: pointer; margin-bottom: 0;
    }
    .ind-header input[type="checkbox"] { cursor: pointer; accent-color: var(--blue); flex-shrink: 0; }
    .ind-label { font-size: 12px; color: var(--text); font-weight: 600; min-width: 38px; }
    .ind-hint  { font-size: 10px; color: var(--text2); flex: 1; }
    .ind-params {
      display: flex; gap: 6px; margin-top: 5px; padding-left: 22px; flex-wrap: wrap;
    }
    .ind-p { display: flex; flex-direction: column; align-items: center; gap: 2px; }
    .ind-input {
      width: 40px; background: var(--bg2); color: var(--text);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 3px 4px; font-size: 11px; text-align: center;
    }
    .ind-input:focus { outline: none; border-color: var(--blue); }
    .ind-input-w56 { width: 56px; }
    .ind-p-lbl { font-size: 9px; color: var(--text2); letter-spacing: 0.3px; }

    /* ── Chart area — flex column ───────────────────────────────── */
    #chart-area {
      flex: 1; display: flex; flex-direction: column;
      overflow: hidden; position: relative;
    }
    #price-chart { flex: 1; min-height: 200px; }

    /* Sub-panels */
    .chart-panel {
      flex-shrink: 0; display: flex; flex-direction: column;
      border-top: 1px solid var(--border);
    }
    .panel-header {
      height: 18px; display: flex; align-items: center;
      padding: 0 8px; background: var(--bg2); flex-shrink: 0;
    }
    .panel-label-text {
      font-size: 10px; color: var(--text2);
      text-transform: uppercase; letter-spacing: 1px;
    }
    .panel-chart-div { flex: 1; }
    #macd-panel { height: 120px; }
    #atr-panel  { height: 80px; }
    #adx-panel  { height: 100px; }

    /* Loading overlay */
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      background: rgba(19,23,34,0.75);
      color: var(--text2); font-size: 13px;
      z-index: 10; pointer-events: none;
    }
    #loading.hidden { display: none; }

    /* Data Health */
    #health-view {
      flex: 1; min-height: 0; overflow: hidden;
      background: var(--bg); display: flex; flex-direction: column;
    }
    #health-toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 12px; border-bottom: 1px solid var(--border);
      background: var(--bg2); flex-shrink: 0;
    }
    #health-refresh {
      background: var(--bg3); color: var(--text);
      border: 1px solid var(--border); border-radius: 3px;
      padding: 4px 10px; cursor: pointer; font-size: 12px;
    }
    #health-refresh:hover { border-color: var(--blue); }
    #health-status { color: var(--text2); font-size: 11px; }
    #health-summary {
      display: grid; grid-template-columns: repeat(8, minmax(110px, 1fr));
      gap: 8px; padding: 10px 12px; border-bottom: 1px solid var(--border);
    }
    .health-metric {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 4px;
      padding: 8px 9px; min-width: 0;
    }
    .health-metric-label {
      color: var(--text2); font-size: 9px; text-transform: uppercase;
      letter-spacing: 0.6px; margin-bottom: 5px;
    }
    .health-metric-value {
      color: var(--text); font-size: 15px; font-weight: 700;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    #health-main {
      flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 300px;
      gap: 10px; padding: 10px 12px; overflow: hidden;
    }
    .health-panel {
      min-height: 0; background: var(--bg2); border: 1px solid var(--border);
      border-radius: 4px; display: flex; flex-direction: column; overflow: hidden;
    }
    .health-panel-header {
      display: flex; align-items: center; gap: 8px; min-height: 34px;
      padding: 7px 9px; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    .health-panel-title { font-size: 12px; font-weight: 700; color: var(--text); }
    .health-panel-subtitle { font-size: 11px; color: var(--text2); margin-left: auto; }
    #health-matrix-wrap { flex: 1; overflow: auto; }
    .health-matrix {
      width: 100%; border-collapse: collapse; table-layout: fixed; font-size: 11px;
    }
    .health-matrix th, .health-matrix td {
      border-bottom: 1px solid var(--border); border-right: 1px solid var(--border);
      padding: 3px 4px; text-align: center; vertical-align: middle;
    }
    .health-matrix th {
      position: sticky; top: 0; z-index: 2; background: var(--bg3);
      color: var(--text2); font-weight: 700;
    }
    .health-matrix th:first-child {
      left: 0; z-index: 3; text-align: left; width: 86px;
    }
    .health-symbol-cell {
      position: sticky; left: 0; z-index: 1; background: var(--bg2);
      color: var(--text); font-weight: 700; text-align: left !important;
    }
    .health-cell { cursor: pointer; min-width: 68px; }
    .health-cell:hover { outline: 1px solid var(--blue); outline-offset: -1px; }
    .health-cell.ok { background: rgba(38,166,154,0.18); }
    .health-cell.warn { background: rgba(255,152,0,0.20); }
    .health-cell.stale { background: rgba(239,83,80,0.22); }
    .health-cell.empty { background: rgba(120,123,134,0.13); color: var(--text2); }
    .health-cell.unknown { background: rgba(41,98,255,0.13); }
    .health-cell-main { display: block; font-weight: 700; line-height: 14px; }
    .health-cell-sub { display: block; color: var(--text2); font-size: 9px; line-height: 12px; }
    #health-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .health-list { overflow: auto; padding: 8px; display: flex; flex-direction: column; gap: 6px; }
    .health-row {
      display: grid; grid-template-columns: 72px 1fr; gap: 6px;
      border-bottom: 1px solid var(--border); padding-bottom: 6px; font-size: 11px;
    }
    .health-row:last-child { border-bottom: none; padding-bottom: 0; }
    .health-row-name { color: var(--text); font-weight: 700; overflow-wrap: anywhere; }
    .health-row-meta { color: var(--text2); overflow-wrap: anywhere; }
    .health-pill {
      display: inline-block; padding: 1px 5px; border-radius: 999px;
      font-size: 10px; border: 1px solid var(--border); color: var(--text2);
    }
    .health-pill.active { color: var(--green); border-color: rgba(38,166,154,0.55); }
    .health-pill.pending { color: #ff9800; border-color: rgba(255,152,0,0.55); }

    /* Scrollbar styling */
    #sidebar-scroll::-webkit-scrollbar { width: 4px; }
    #sidebar-scroll::-webkit-scrollbar-track { background: var(--bg2); }
    #sidebar-scroll::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  </style>
</head>
<body>
<div id="app">

  <!-- ── Header ─────────────────────────────────────────────────── -->
  <div id="header">
    <span id="header-title">&#x1F4C8; AutoTrading Chart</span>
    <div id="view-tabs">
      <button class="view-tab active" data-view="chart">Chart</button>
      <button class="view-tab" data-view="health">Data Health</button>
    </div>
    <span id="status-msg"></span>
    <span id="refresh-badge">—</span>
    <div id="ohlc-bar"></div>
  </div>

  <!-- ── Body ───────────────────────────────────────────────────── -->
  <div id="body">

    <!-- Sidebar -->
    <div id="sidebar">
      <div id="sidebar-scroll">

        <span class="section-label">Timeframe</span>
        <div id="tf-buttons"><!-- populated by JS --></div>

        <span class="section-label">Candles</span>
        <select id="bars-select">
          <option value="100">100</option>
          <option value="200">200</option>
          <option value="500" selected>500</option>
          <option value="1000">1 000</option>
          <option value="2000">2 000</option>
        </select>

        <span class="section-label">Indicators</span>
        <div id="indicator-controls">
          <!-- SMA — 3 đường, period=0 → bỏ qua -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-ma" checked>
              <span class="ind-label">SMA</span>
              <span class="ind-hint">0 = ẩn</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="ma-p1" value="20" min="0" max="500">
                <span class="ind-p-lbl" style="color:#2196F3">● p1</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ma-p2" value="0" min="0" max="500">
                <span class="ind-p-lbl" style="color:#FF9800">● p2</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ma-p3" value="0" min="0" max="500">
                <span class="ind-p-lbl" style="color:#9C27B0">● p3</span>
              </div>
            </div>
          </div>
          <!-- EMA — 3 đường -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-ema">
              <span class="ind-label">EMA</span>
              <span class="ind-hint">0 = ẩn</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="ema-p1" value="20" min="0" max="500">
                <span class="ind-p-lbl" style="color:#00BCD4">● p1</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ema-p2" value="0" min="0" max="500">
                <span class="ind-p-lbl" style="color:#CDDC39">● p2</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ema-p3" value="0" min="0" max="500">
                <span class="ind-p-lbl" style="color:#F06292">● p3</span>
              </div>
            </div>
          </div>
          <!-- Bollinger Bands -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-bb">
              <span class="ind-label">BB</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="bb-period" value="20" min="2" max="500">
                <span class="ind-p-lbl">period</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="bb-std" value="2.0" min="0.5" max="5" step="0.5">
                <span class="ind-p-lbl">std</span>
              </div>
            </div>
          </div>
          <!-- MACD -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-macd">
              <span class="ind-label">MACD</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="macd-fast" value="12" min="2" max="100">
                <span class="ind-p-lbl">fast</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="macd-slow" value="26" min="2" max="200">
                <span class="ind-p-lbl">slow</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="macd-sig" value="9" min="2" max="50">
                <span class="ind-p-lbl">signal</span>
              </div>
            </div>
          </div>
          <!-- ATR -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-atr">
              <span class="ind-label">ATR</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="atr-period" value="14" min="2" max="100">
                <span class="ind-p-lbl">period</span>
              </div>
            </div>
          </div>
          <!-- ADX -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-adx">
              <span class="ind-label">ADX</span>
              <span class="ind-hint">+DI / −DI</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="adx-period" value="14" min="2" max="100">
                <span class="ind-p-lbl">period</span>
              </div>
            </div>
          </div>
          <!-- AI Trend Navigator / KNN -->
          <div class="ind-block">
            <label class="ind-header">
              <input type="checkbox" id="ind-ai-trend">
              <span class="ind-label">AI Trend</span>
              <span class="ind-hint">KNN</span>
            </label>
            <div class="ind-params">
              <div class="ind-p">
                <input class="ind-input" type="number" id="ai-ma-len" value="5" min="2" max="200">
                <span class="ind-p-lbl">ma</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ai-target-len" value="5" min="2" max="200">
                <span class="ind-p-lbl">target</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ai-k" value="3" min="2" max="200">
                <span class="ind-p-lbl">k</span>
              </div>
              <div class="ind-p">
                <input class="ind-input" type="number" id="ai-smooth" value="50" min="2" max="500">
                <span class="ind-p-lbl">smooth</span>
              </div>
            </div>
          </div>
        </div>

        <span class="section-label">Symbol</span>
        <div id="sym-panel"><!-- populated by JS --></div>

      </div>
    </div>

    <!-- Chart area -->
    <div id="chart-area">
      <div id="price-chart"></div>
      <!-- MACD sub-panel (hidden by default) -->
      <div id="macd-panel" class="chart-panel" style="display:none">
        <div class="panel-header">
          <span class="panel-label-text">MACD</span>
        </div>
        <div id="macd-chart" class="panel-chart-div"></div>
      </div>
      <!-- ATR sub-panel (hidden by default) -->
      <div id="atr-panel" class="chart-panel" style="display:none">
        <div class="panel-header">
          <span class="panel-label-text">ATR</span>
        </div>
        <div id="atr-chart" class="panel-chart-div"></div>
      </div>
      <!-- ADX sub-panel (hidden by default) -->
      <div id="adx-panel" class="chart-panel" style="display:none">
        <div class="panel-header">
          <span class="panel-label-text">ADX</span>
          <span style="font-size:9px;color:#26a69a;margin-left:8px">— ADX</span>
          <span style="font-size:9px;color:#26a69a;opacity:0.6;margin-left:6px">- +DI</span>
          <span style="font-size:9px;color:#ef5350;opacity:0.6;margin-left:6px">- −DI</span>
        </div>
        <div id="adx-chart" class="panel-chart-div"></div>
      </div>
      <div id="loading">Loading&#x2026;</div>
    </div>

  </div><!-- /#body -->

  <div id="health-view" class="hidden">
    <div id="health-toolbar">
      <button id="health-refresh">Refresh</button>
      <span id="health-status">Data health not loaded</span>
    </div>
    <div id="health-summary"></div>
    <div id="health-main">
      <section class="health-panel">
        <div class="health-panel-header">
          <span class="health-panel-title">Symbol x Timeframe Matrix</span>
          <span class="health-panel-subtitle" id="health-matrix-totals"></span>
        </div>
        <div id="health-matrix-wrap"></div>
      </section>
      <aside id="health-side">
        <section class="health-panel" style="flex: 1">
          <div class="health-panel-header">
            <span class="health-panel-title">ActiveTask Locks</span>
          </div>
          <div id="health-locks" class="health-list"></div>
        </section>
        <section class="health-panel" style="flex: 1">
          <div class="health-panel-header">
            <span class="health-panel-title">Staging Backlog</span>
          </div>
          <div id="health-staging" class="health-list"></div>
        </section>
      </aside>
    </div>
  </div>
</div><!-- /#app -->

<script>
// =============================================================================
// AutoTrading Chart v5.0 — Lightweight Charts 4.2.1
// =============================================================================

// ── Trạng thái ──────────────────────────────────────────────────────────────
let currentSymbol = 'EURUSD';
let currentTf     = 'H1';
let currentBars   = 500;
let refreshTimer  = null;
let healthTimer   = null;
let currentView   = 'chart';
const REFRESH_MS  = 60_000;

// ── Màu sắc ─────────────────────────────────────────────────────────────────
const C = {
  bg: '#131722', bg2: '#1e222d', bg3: '#2a2e39',
  border: '#363a45', text: '#d1d4dc', text2: '#787b86',
  blue: '#2962ff', green: '#26a69a', red: '#ef5350',
};

// ── Common sub-panel chart options ───────────────────────────────────────────
const _subOpts = {
  layout: {
    background: { type: 'solid', color: C.bg },
    textColor: C.text2,
    fontFamily: 'Arial, Helvetica, sans-serif',
    fontSize: 10,
  },
  grid: {
    vertLines: { color: 'transparent' },
    horzLines: { color: C.border },
  },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale: { borderColor: C.border, scaleMargins: { top: 0.1, bottom: 0.1 } },
  timeScale: { borderColor: C.border, visible: false },
  handleScroll: { mouseWheel: true, pressedMouseMove: true },
  handleScale: { mouseWheel: true, pinch: true },
};

// =============================================================================
// KHỞI TẠO CHARTS
// =============================================================================

  },

const candleSeries = chart.addCandlestickSeries({

// ── Overlay series ────────────────────────────────────────────────────────────
// SMA: 3 slots, tạo lazy khi dùng lần đầu
const MA_COLORS  = ['#2196F3', '#FF9800', '#9C27B0'];
const EMA_COLORS = ['#00BCD4', '#CDDC39', '#F06292'];
let maSeries  = [null, null, null];
let emaSeries = [null, null, null];
let bbUpper   = null;
let bbMid     = null;
let bbLower   = null;
let aiTrendSeries    = null;
let aiTrendAvgSeries = null;

// ── MACD sub-panel ───────────────────────────────────────────────────────────
const macdPanelEl   = document.getElementById('macd-panel');
const macdChartEl   = document.getElementById('macd-chart');
const macdChart     = LightweightCharts.createChart(macdChartEl, _subOpts);
const macdHistSeries   = macdChart.addHistogramSeries({

});
const macdLineSeries   = macdChart.addLineSeries({

// ── ATR sub-panel ────────────────────────────────────────────────────────────
const atrPanelEl  = document.getElementById('atr-panel');

const atrChart    = LightweightCharts.createChart(atrChartEl, _subOpts);
const atrLineSeries = atrChart.addLineSeries({

});

// ── ADX sub-panel ────────────────────────────────────────────────────────────
const adxPanelEl     = document.getElementById('adx-panel');

const adxChart       = LightweightCharts.createChart(adxChartEl, _subOpts);
const adxLineSeries  = adxChart.addLineSeries({

});
const adxPlusSeries  = adxChart.addLineSeries({
  color: '#26a69a', lineWidth: 1, lineStyle: 1,
  priceLineVisible: false, lastValueVisible: false,
});
const adxMinusSeries = adxChart.addLineSeries({
  color: '#ef5350', lineWidth: 1, lineStyle: 1,
  priceLineVisible: false, lastValueVisible: false,
});

// ── Resize observer — tất cả chart divs ─────────────────────────────────────
const ro = new ResizeObserver(entries => {
  for (const e of entries) {
    const { width, height } = e.contentRect;
    if (!width || !height) continue;
    if (e.target === priceChartEl) chart.applyOptions({ width, height });
    if (e.target === macdChartEl)  macdChart.applyOptions({ width, height });
    if (e.target === atrChartEl)   atrChart.applyOptions({ width, height });
    if (e.target === adxChartEl)   adxChart.applyOptions({ width, height });
  }
});
ro.observe(priceChartEl);
ro.observe(macdChartEl);
ro.observe(atrChartEl);
ro.observe(adxChartEl);

// ── Đồng bộ time range giữa các charts ──────────────────────────────────────
let _syncLock = false;

function _syncFrom(src, targets) {
  src.timeScale().subscribeVisibleLogicalRangeChange(range => {
    if (_syncLock || !range) return;
    _syncLock = true;
    try {
      targets.forEach(({ chart: tc, panel }) => {
        if (!panel || panel.offsetParent !== null) {
          tc.timeScale().setVisibleLogicalRange(range);
        }
      });
    } finally {
      _syncLock = false;
    }
  });
}

_syncFrom(chart,     [{ chart: macdChart, panel: macdPanelEl },
                      { chart: atrChart,  panel: atrPanelEl  },
                      { chart: adxChart,  panel: adxPanelEl  }]);
_syncFrom(macdChart, [{ chart: chart,     panel: null         },
                      { chart: atrChart,  panel: atrPanelEl  },
                      { chart: adxChart,  panel: adxPanelEl  }]);
_syncFrom(atrChart,  [{ chart: chart,     panel: null         },
                      { chart: macdChart, panel: macdPanelEl },
                      { chart: adxChart,  panel: adxPanelEl  }]);
_syncFrom(adxChart,  [{ chart: chart,     panel: null         },
                      { chart: macdChart, panel: macdPanelEl },
                      { chart: atrChart,  panel: atrPanelEl  }]);

// =============================================================================
// INDICATOR SPEC
// =============================================================================

function buildIndSpec() {
  const parts = [];
  // SMA — 3 periods (0 = bỏ qua)
  if (document.getElementById('ind-ma').checked)
    [1,2,3].forEach(i => {
      const v = parseInt(document.getElementById(`ma-p${i}`).value) || 0;
      if (v > 0) parts.push('MA' + v);
    });
  // EMA — 3 periods (0 = bỏ qua)
  if (document.getElementById('ind-ema').checked)
    [1,2,3].forEach(i => {
      const v = parseInt(document.getElementById(`ema-p${i}`).value) || 0;
      if (v > 0) parts.push('EMA' + v);
    });
  // Bollinger Bands
  if (document.getElementById('ind-bb').checked)
    parts.push('BB' + document.getElementById('bb-period').value
               + '-' + document.getElementById('bb-std').value);
  // MACD với tham số fast/slow/signal
  if (document.getElementById('ind-macd').checked)
    parts.push('MACD'
      + document.getElementById('macd-fast').value + '-'
      + document.getElementById('macd-slow').value + '-'
      + document.getElementById('macd-sig').value);
  // ATR
  if (document.getElementById('ind-atr').checked)
    parts.push('ATR' + document.getElementById('atr-period').value);
  // ADX
  if (document.getElementById('ind-adx').checked)
    parts.push('ADX' + document.getElementById('adx-period').value);
  // AI Trend Navigator / KNN
  if (document.getElementById('ind-ai-trend').checked)
    parts.push('AITREND'
      + document.getElementById('ai-ma-len').value + '-'
      + document.getElementById('ai-target-len').value + '-'
      + document.getElementById('ai-k').value + '-'
      + document.getElementById('ai-smooth').value);
  return parts.join(',');
}

// =============================================================================
// APPLY INDICATORS — vẽ/xóa series và hiện/ẩn sub-panels
// =============================================================================

function applyIndicators(inds) {
  // ── SMA overlay — tối đa 3 đường ────────────────────────────────────────
  const maKeys = Object.keys(inds)
    .filter(k => k.startsWith('ma_'))
    .sort((a, b) => +a.slice(3) - +b.slice(3));
  maKeys.forEach((key, i) => {
    if (!maSeries[i]) {
      maSeries[i] = chart.addLineSeries({
        color: MA_COLORS[i], lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false,
      });
    }
    maSeries[i].setData(inds[key]);
  });
  for (let i = maKeys.length; i < 3; i++) {
    if (maSeries[i]) maSeries[i].setData([]);
  }

  // ── EMA overlay — tối đa 3 đường ────────────────────────────────────────
  const emaKeys = Object.keys(inds)
    .filter(k => k.startsWith('ema_'))
    .sort((a, b) => +a.slice(4) - +b.slice(4));
  emaKeys.forEach((key, i) => {
    if (!emaSeries[i]) {
      emaSeries[i] = chart.addLineSeries({
        color: EMA_COLORS[i], lineWidth: 1, lineStyle: 2,
        priceLineVisible: false, lastValueVisible: false,
      });
    }
    emaSeries[i].setData(inds[key]);
  });
  for (let i = emaKeys.length; i < 3; i++) {
    if (emaSeries[i]) emaSeries[i].setData([]);
  }

  // ── Bollinger Bands overlay ──────────────────────────────────────────────
  if (inds.bb_upper && inds.bb_upper.length) {
    if (!bbUpper) {
      const baseOpts = { priceLineVisible: false, lastValueVisible: false };
      bbUpper = chart.addLineSeries({ ...baseOpts, color: 'rgba(255,152,0,0.8)', lineWidth: 1, lineStyle: 1 });
      bbMid   = chart.addLineSeries({ ...baseOpts, color: 'rgba(255,152,0,0.45)', lineWidth: 1 });
      bbLower = chart.addLineSeries({ ...baseOpts, color: 'rgba(255,152,0,0.8)', lineWidth: 1, lineStyle: 1 });
    }
    bbUpper.setData(inds.bb_upper);
    bbMid.setData(inds.bb_mid);
    bbLower.setData(inds.bb_lower);
  } else if (bbUpper) {
    bbUpper.setData([]); bbMid.setData([]); bbLower.setData([]);
  }

  // AI Trend Navigator / KNN overlay
  const showAiTrend = !!(inds.ai_trend_knn && inds.ai_trend_knn.length);
  if (showAiTrend) {
    if (!aiTrendSeries) {
      aiTrendSeries = chart.addLineSeries({
        color: '#00e676', lineWidth: 2,
        priceLineVisible: false, lastValueVisible: false,
      });
      aiTrendAvgSeries = chart.addLineSeries({
        color: '#009688', lineWidth: 1, lineStyle: 1,
        priceLineVisible: false, lastValueVisible: false,
      });
    }
    aiTrendSeries.setData(inds.ai_trend_knn);
    aiTrendAvgSeries.setData(inds.ai_trend_avg || []);
  } else if (aiTrendSeries) {
    aiTrendSeries.setData([]);
    aiTrendAvgSeries.setData([]);
  }

  // MACD sub-panel
  const showMacd = !!(inds.macd_hist && inds.macd_hist.length);
  macdPanelEl.style.display = showMacd ? 'flex' : 'none';
  if (showMacd) {
    macdHistSeries.setData(inds.macd_hist);
    macdLineSeries.setData(inds.macd_line    || []);
    macdSignalSeries.setData(inds.macd_signal || []);
    requestAnimationFrame(() => {
      macdChart.applyOptions({ width: macdChartEl.clientWidth, height: macdChartEl.clientHeight });
    });
  } else {
    macdHistSeries.setData([]); macdLineSeries.setData([]); macdSignalSeries.setData([]);
  }

  // ── ATR sub-panel ────────────────────────────────────────────────────────
  const showAtr = !!(inds.atr && inds.atr.length);
  atrPanelEl.style.display = showAtr ? 'flex' : 'none';
  if (showAtr) {
    atrLineSeries.setData(inds.atr);
    requestAnimationFrame(() => {
      atrChart.applyOptions({ width: atrChartEl.clientWidth, height: atrChartEl.clientHeight });
    });
  } else {
    atrLineSeries.setData([]);
  }

  // ── ADX sub-panel ────────────────────────────────────────────────────────
  const showAdx = !!(inds.adx && inds.adx.length);
  adxPanelEl.style.display = showAdx ? 'flex' : 'none';
  if (showAdx) {
    adxLineSeries.setData(inds.adx);
    adxPlusSeries.setData(inds.adx_pdi  || []);
    adxMinusSeries.setData(inds.adx_mdi || []);
    requestAnimationFrame(() => {
      adxChart.applyOptions({ width: adxChartEl.clientWidth, height: adxChartEl.clientHeight });
    });
  } else {
    adxLineSeries.setData([]); adxPlusSeries.setData([]); adxMinusSeries.setData([]);
  }
}

// =============================================================================
// LOAD DỮ LIỆU
// =============================================================================

async function loadCandles() {
  setLoading(true);
  const indSpec = buildIndSpec();
  const url = `/api/candles?symbol=${encodeURIComponent(currentSymbol)}`
            + `&tf=${encodeURIComponent(currentTf)}&bars=${currentBars}`
            + (indSpec ? `&ind=${encodeURIComponent(indSpec)}` : '');

  try {
    const resp = await fetch(url);
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    // Hỗ trợ cả response mới {candles, indicators} và cũ (flat array)
    const candles = Array.isArray(data) ? data : (data.candles ?? []);

    if (!candles.length) {
      setStatus(`Khong co du lieu cho ${currentSymbol} ${currentTf}`);
      clearOhlcBar();
      return;
    }

    candleSeries.setData(candles);
    volumeSeries.setData(candles.map(d => ({
      time: d.time, value: d.volume,
      color: d.close >= d.open ? 'rgba(38,166,154,0.35)' : 'rgba(239,83,80,0.35)',
    })));
    chart.timeScale().fitContent();
    updateOhlcBar(candles[candles.length - 1]);
    setStatus('');

    applyIndicators(data.indicators ?? {});

  } catch (err) {
    setStatus('Loi tai du lieu: ' + err.message);
    console.error('[chart] loadCandles error:', err);
  } finally {
    setLoading(false);
    document.getElementById('refresh-badge').textContent =
      '~ ' + new Date().toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
  }
}

// =============================================================================
// DATA HEALTH DASHBOARD
// =============================================================================

function fmtInt(v) {
  if (v == null || Number.isNaN(Number(v))) return '-';
  return Number(v).toLocaleString('en-US');
}

function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, ch => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[ch]));
}

function fmtDateTime(v) {
  if (!v) return '-';
  const d = new Date(v + (String(v).endsWith('Z') ? '' : 'Z'));
  if (Number.isNaN(d.getTime())) return String(v);
  return d.toLocaleString('vi-VN', {
    month: '2-digit', day: '2-digit',
    hour: '2-digit', minute: '2-digit',
  });
}

function fmtLag(minutes) {
  if (minutes == null) return '-';
  const m = Number(minutes);
  if (m < 0) return 'future';
  if (m < 60) return `${m}m`;
  if (m < 1440) return `${Math.round(m / 60)}h`;
  return `${Math.round(m / 1440)}d`;
}

function compactRows(v) {
  const n = Number(v || 0);
  if (!n) return '0';
  if (n >= 1_000_000) return (n / 1_000_000).toFixed(1) + 'm';
  if (n >= 10_000) return Math.round(n / 1000) + 'k';
  if (n >= 1000) return (n / 1000).toFixed(1) + 'k';
  return String(n);
}

function setHealthStatus(msg) {
  document.getElementById('health-status').textContent = msg;
}

function renderHealthSummary(summary) {
  const items = [
    ['Fact Rows', fmtInt(summary.TotalRows)],
    ['Rows 24h', fmtInt(summary.RowsCreatedLast24h)],
    ['Rows Today UTC', fmtInt(summary.RowsCreatedTodayUtc)],
    ['Symbols', `${fmtInt(summary.SymbolsWithData)} / ${fmtInt(summary.TotalSymbols)}`],
    ['Timeframes', `${fmtInt(summary.TimeframesWithData)} / ${fmtInt(summary.TotalTimeframes)}`],
    ['Oldest Bar', fmtDateTime(summary.OldestBarTime)],
    ['Latest Bar', fmtDateTime(summary.LatestBarTime)],
    ['Latest Write', fmtDateTime(summary.LatestCreatedAt)],
  ];
  document.getElementById('health-summary').innerHTML = items.map(([label, value]) => `
    <div class="health-metric">
      <div class="health-metric-label">${esc(label)}</div>
      <div class="health-metric-value" title="${esc(value)}">${esc(value)}</div>
    </div>
  `).join('');
}

function renderHealthMatrix(matrix) {
  const wrap = document.getElementById('health-matrix-wrap');
  const tfs = matrix.timeframes || [];
  const totals = matrix.totals || {};
  document.getElementById('health-matrix-totals').textContent =
    `OK ${fmtInt(totals.ok)} | Warn ${fmtInt(totals.warn)} | Stale ${fmtInt(totals.stale)} | Empty ${fmtInt(totals.empty)}`;

  const head = `<thead><tr><th>Symbol</th>${tfs.map(tf => `<th>${tf}</th>`).join('')}</tr></thead>`;
  const rows = (matrix.symbols || []).map(item => {
    const cells = tfs.map(tf => {
      const c = (item.cells || {})[tf] || { state: 'empty', RowCount: 0 };
      const state = c.state || 'unknown';
      const title = [
        `${item.symbol} ${tf}`,
        `Rows: ${fmtInt(c.RowCount)}`,
        `Oldest: ${fmtDateTime(c.OldestBarTime)}`,
        `Latest: ${fmtDateTime(c.LatestBarTime)}`,
        `Lag: ${fmtLag(c.LatestLagMinutes)}`,
        `Latest write: ${fmtDateTime(c.LatestCreatedAt)}`,
      ].join('\n');
      return `<td class="health-cell ${state}" title="${esc(title)}" data-symbol="${esc(item.symbol)}" data-tf="${esc(tf)}">
        <span class="health-cell-main">${compactRows(c.RowCount)}</span>
        <span class="health-cell-sub">${fmtLag(c.LatestLagMinutes)}</span>
      </td>`;
    }).join('');
    return `<tr><td class="health-symbol-cell">${esc(item.symbol)}</td>${cells}</tr>`;
  }).join('');
  wrap.innerHTML = `<table class="health-matrix">${head}<tbody>${rows}</tbody></table>`;

  wrap.querySelectorAll('.health-cell').forEach(cell => {
    cell.addEventListener('click', () => {
      const sym = cell.dataset.symbol;
      const tf = cell.dataset.tf;
      if (sym && tf) {
        selectSymbol(sym);
        selectTf(tf);
        switchView('chart');
      }
    });
  });
}

function renderLocks(data) {
  const items = data.items || [];
  const el = document.getElementById('health-locks');
  if (!items.length) {
    el.innerHTML = '<div class="health-row-meta">No ActiveTask rows.</div>';
    return;
  }
  el.innerHTML = items.map(item => {
    const active = Number(item.IsActive) === 1;
    return `<div class="health-row">
      <div class="health-row-name">${esc(item.TaskName)}</div>
      <div class="health-row-meta">
        <span class="health-pill ${active ? 'active' : ''}">${active ? 'active' : 'expired'}</span>
        expires ${fmtDateTime(item.ExpiresAt)}<br>
        started ${fmtDateTime(item.StartedAt)}
      </div>
    </div>`;
  }).join('');
}

function renderStaging(data) {
  const items = data.items || [];
  const el = document.getElementById('health-staging');
  if (!items.length) {
    el.innerHTML = '<div class="health-row-meta">No staging data.</div>';
    return;
  }
  el.innerHTML = items.map(item => {
    const pending = Number(item.PendingRows || 0);
    const hasPending = pending > 0;
    const meta = item.error
      ? `<span style="color:${C.red}">${esc(item.error)}</span>`
      : `<span class="health-pill ${hasPending ? 'pending' : ''}">${fmtInt(pending)} pending</span>
         total ${fmtInt(item.TotalRows)}<br>latest ${fmtDateTime(item.LatestBarTime)}`;
    return `<div class="health-row">
      <div class="health-row-name">${esc(item.TFCode)}</div>
      <div class="health-row-meta">${meta}</div>
    </div>`;
  }).join('');
}

async function loadHealth() {
  setHealthStatus('Loading data health...');
  try {
    const fetchJson = async (url) => {
      const resp = await fetch(url, { cache: 'no-store' });
      if (!resp.ok) throw new Error(`${url} HTTP ${resp.status}`);
      return resp.json();
    };
    const summary = await fetchJson('/api/health/summary');
    renderHealthSummary(summary);
    const matrix = await fetchJson('/api/health/matrix');
    renderHealthMatrix(matrix);
    const locks = await fetchJson('/api/health/locks');
    renderLocks(locks);
    const staging = await fetchJson('/api/health/staging');
    renderStaging(staging);
    setHealthStatus('Updated ' + new Date().toLocaleTimeString('vi-VN'));
  } catch (err) {
    console.error('[health] load error:', err);
    setHealthStatus('Data health error: ' + err.message);
  }
}

function startHealthRefresh() {
  clearHealthRefresh();
  loadHealth();
  healthTimer = setInterval(loadHealth, REFRESH_MS);
}

function clearHealthRefresh() {
  if (healthTimer) { clearInterval(healthTimer); healthTimer = null; }
}

function switchView(view) {
  currentView = view;
  document.querySelectorAll('.view-tab').forEach(btn =>
    btn.classList.toggle('active', btn.dataset.view === view));
  document.getElementById('body').classList.toggle('hidden', view !== 'chart');
  document.getElementById('health-view').classList.toggle('hidden', view !== 'health');
  if (view === 'health') {
    clearAutoRefresh();
    startHealthRefresh();
  } else {
    clearHealthRefresh();
    chart.applyOptions({ width: priceChartEl.clientWidth, height: priceChartEl.clientHeight });
    startAutoRefresh();
  }
}

// =============================================================================
// OHLC INFO BAR
// =============================================================================

function fmtPrice(v) {
  if (v == null) return '—';
  if (v >= 1000) return v.toFixed(2);
  if (v >= 10)   return v.toFixed(3);
  return v.toFixed(5);
}

function updateOhlcBar(bar) {
  if (!bar) { clearOhlcBar(); return; }
  const chg  = bar.close - bar.open;
  const pct  = bar.open !== 0 ? (chg / bar.open * 100) : 0;
  const sign = chg >= 0 ? '+' : '';
  const col  = chg >= 0 ? C.green : C.red;

  document.getElementById('ohlc-bar').innerHTML =
    `<span style="color:${C.text2}">O </span><span>${fmtPrice(bar.open)}</span>  ` +
    `<span style="color:${C.green}">H </span><span>${fmtPrice(bar.high)}</span>  ` +
    `<span style="color:${C.red}">L </span><span>${fmtPrice(bar.low)}</span>  ` +
    `<span style="color:${C.text2}">C </span><span>${fmtPrice(bar.close)}</span>  ` +
    `<span style="color:${col};font-weight:600">${sign}${fmtPrice(chg)} (${sign}${pct.toFixed(2)}%)</span>`;
}

function clearOhlcBar() {
  document.getElementById('ohlc-bar').innerHTML = '';
}

chart.subscribeCrosshairMove(param => {
  if (!param.time || param.point === undefined || !param.seriesData.size) return;
  const bar = param.seriesData.get(candleSeries);
  if (bar) updateOhlcBar(bar);
});

// =============================================================================
// UI HELPERS
// =============================================================================

function setLoading(on) {
  document.getElementById('loading').classList.toggle('hidden', !on);
}

function setStatus(msg) {
  document.getElementById('status-msg').textContent = msg;
}

function selectSymbol(sym) {
  currentSymbol = sym;
  document.querySelectorAll('.sym-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.sym === sym));
  reloadWithReset();
}

function selectTf(tf) {
  currentTf = tf;
  document.querySelectorAll('.tf-btn').forEach(b =>
    b.classList.toggle('active', b.dataset.tf === tf));
  reloadWithReset();
}

function reloadWithReset() {
  clearAutoRefresh();
  loadCandles();
  startAutoRefresh();
}

function startAutoRefresh() {
  clearAutoRefresh();
  refreshTimer = setInterval(() => loadCandles(), REFRESH_MS);
}
function clearAutoRefresh() {
  if (refreshTimer) { clearInterval(refreshTimer); refreshTimer = null; }
}

async function initSidebar() {
  // ── Timeframes — grouped ─────────────────────────────────────────────────
  try {
    const tfData = await (await fetch('/api/timeframes')).json();
    const tfWrap = document.getElementById('tf-buttons');

    const groups = [
      { label: 'Direct',   tfs: tfData.direct   ?? [] },
      { label: 'Computed', tfs: tfData.computed  ?? [] },
    ];
    groups.forEach(({ label, tfs }) => {
      const lbl = document.createElement('div');
      lbl.className = 'tf-group-label';
      lbl.textContent = label;
      tfWrap.appendChild(lbl);
      tfs.forEach(tf => {
        const btn = document.createElement('button');
        btn.className   = 'tf-btn' + (tf === currentTf ? ' active' : '');
        btn.textContent = tf;
        btn.dataset.tf  = tf;
        btn.onclick = () => selectTf(tf);
        tfWrap.appendChild(btn);
      });
    });
  } catch (err) {
    console.error('[chart] Failed to load timeframes:', err);
  }

  // ── Symbols ──────────────────────────────────────────────────────────────
  try {
    const groups = await (await fetch('/api/symbols')).json();
    const panel  = document.getElementById('sym-panel');

    Object.entries(groups).forEach(([groupName, syms]) => {
      const groupDiv = document.createElement('div');
      groupDiv.className = 'sym-group';

      const label = document.createElement('span');
      label.className   = 'sym-group-name';
      label.textContent = groupName;
      groupDiv.appendChild(label);

      const btnWrap = document.createElement('div');
      btnWrap.className = 'sym-buttons';

      syms.forEach(sym => {
        const btn = document.createElement('button');
        btn.className   = 'sym-btn' + (sym === currentSymbol ? ' active' : '');
        btn.textContent = sym;
        btn.dataset.sym = sym;
        btn.onclick     = () => selectSymbol(sym);
        btnWrap.appendChild(btn);
      });

      groupDiv.appendChild(btnWrap);
      panel.appendChild(groupDiv);
    });
  } catch (err) {
    console.error('[chart] Failed to load symbols:', err);
  }
}

// ── Bars selector ─────────────────────────────────────────────────────────────
document.getElementById('bars-select').addEventListener('change', e => {
  currentBars = parseInt(e.target.value, 10);
  reloadWithReset();
});

// ── Indicator controls — bất kỳ thay đổi nào đều reload ─────────────────────
document.querySelectorAll('#indicator-controls input').forEach(el => {
  el.addEventListener('change', () => reloadWithReset());
});

document.querySelectorAll('.view-tab').forEach(btn => {
  btn.addEventListener('click', () => switchView(btn.dataset.view));
});
document.getElementById('health-refresh').addEventListener('click', loadHealth);

// =============================================================================
// KHỞI ĐỘNG
// =============================================================================

(async function init() {
  await initSidebar();
  await loadCandles();
  startAutoRefresh();
})();
</script>
</body>
