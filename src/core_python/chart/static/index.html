<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SEN05 Strategy Signals</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="title">SEN05 Signals</div>
        <div id="meta" class="meta">Loading</div>
      </div>
      <div class="controls primary-controls">
        <label>
          Strategy
          <select id="strategy"></select>
        </label>
        <label>
          Asset Type
          <select id="asset-type"></select>
        </label>
        <label>
          Symbol
          <select id="symbol"></select>
        </label>
        <label>
          TF
          <select id="tf"></select>
        </label>
        <label>
          Start Date
          <input id="start-date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" />
        </label>
        <label>
          End Date
          <input id="end-date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" />
        </label>
        <label>
          Theme
          <select id="theme-select">
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
        <label class="color-control">
          Up
          <input id="candle-up-color" type="color" value="#16a34a" />
        </label>
        <label class="color-control">
          Down
          <input id="candle-down-color" type="color" value="#dc2626" />
        </label>
        <label id="bars-control" hidden>
          <span id="bars-caption">Bars</span>
          <input id="bars" type="number" min="50" max="20000" step="50" />
        </label>
        <button id="refresh" type="button">Refresh</button>
        <button id="export-btn" type="button">Export CSV</button>
        <button id="bulk-export-btn" type="button">Bulk Export</button>
      </div>
    </header>

    <main class="layout">
      <aside class="sidebar">
        <div class="panel-title">Parameters</div>
        <div id="params" class="params-grid"></div>
      </aside>

      <section class="workspace">
        <div class="stats">
          <div><span>Total</span><strong id="stat-total">0</strong></div>
          <div><span>Buy</span><strong id="stat-buy">0</strong></div>
          <div><span>Sell</span><strong id="stat-sell">0</strong></div>
          <div><span>Last</span><strong id="stat-last">-</strong></div>
          <div class="stat-note" title="Chart may include the current not-yet-closed bar. Live signal generation should use completed bar snapshots.">&#9432; includes live bar</div>
        </div>
        <div id="scan-warning" class="scan-warning" hidden></div>
        <div id="error" class="error" hidden></div>
        <div id="loading-overlay" class="loading-overlay" hidden>
          <div class="loading-spinner"></div>
          <span id="loading-text">Loading chart data...</span>
        </div>
        <div id="price-chart" class="chart price-chart">
          <div id="chart-legend" class="chart-legend"></div>
        </div>
        <div id="panel-charts" class="panel-charts"></div>
        <div class="table-wrap">
          <table>
            <thead id="signals-head"></thead>
            <tbody id="signals-body"></tbody>
          </table>
        </div>
      </section>
    </main>

    <dialog id="export-modal" class="export-dialog">
      <div class="modal-header">
        <span>Export Columns</span>
        <button id="modal-close" class="modal-x" type="button">✕</button>
      </div>
      <div class="modal-section">
        <div class="modal-subtitle">Export Range</div>
        <div class="modal-range">
          <label>
            Start Date
            <input id="export-start-date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" />
          </label>
          <label>
            End Date
            <input id="export-end-date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" />
          </label>
        </div>
        <div id="export-range-note" class="modal-note">Loading available data range...</div>
      </div>
      <div class="modal-section">
        <div class="modal-subtitle">Columns</div>
        <div id="export-cols" class="modal-cols"></div>
      </div>
      <div class="modal-footer">
        <button id="modal-export" type="button">Download CSV</button>
        <button id="modal-cancel" type="button">Cancel</button>
      </div>
    </dialog>
    <dialog id="bulk-export-modal" class="export-dialog bulk-export-dialog">
      <div class="modal-header">
        <span>Bulk Export</span>
        <button id="bulk-modal-close" class="modal-x" type="button">x</button>
      </div>
      <div class="modal-section">
        <div class="modal-subtitle">Export Range</div>
        <div class="modal-range">
          <label>
            Start Date
            <input id="bulk-export-start-date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" />
          </label>
          <label>
            End Date
            <input id="bulk-export-end-date" type="text" inputmode="numeric" placeholder="dd/mm/yyyy" autocomplete="off" />
          </label>
        </div>
        <div id="bulk-export-range-note" class="modal-note">Loading available data range...</div>
      </div>
      <div class="modal-section">
        <div class="modal-subtitle">Symbols</div>
        <div class="modal-actions">
          <button id="bulk-symbols-all" type="button">All</button>
          <button id="bulk-symbols-none" type="button">None</button>
        </div>
        <div id="bulk-symbols" class="modal-cols bulk-symbol-grid"></div>
      </div>
      <div class="modal-section">
        <div class="modal-subtitle">Optional Columns</div>
        <div id="bulk-cols" class="modal-cols"></div>
      </div>
      <div class="modal-footer">
        <button id="bulk-modal-export" type="button">Download CSV</button>
        <button id="bulk-modal-cancel" type="button">Cancel</button>
      </div>
    </dialog>
    <script src="/assets/lightweight-charts.js"></script>
    <script src="/static/app.js"></script>
  </body>
</html>
