# Default manifest for backtest_optimize.
# Strategy configs select signal context. Presets select reusable execution
# components such as entry, stoploss, takeprofit, order, sizing, and exits.
# Runtime loaders may use notebooks or plain Python dictionaries; PyYAML is
# intentionally not required by the package.

run:
  active_strategy: combo
  active_preset: combo_ctrader_v0
  ambiguity_policy: conservative
  ohlcv_source: core_python.data.loader
  signal_source: raw_signals
  time_convention: UTC-naive bar-open timestamps

config_paths:
  strategies: configs/strategies
  presets: configs/presets
  generic_research_grid: configs/param_grids.yaml

available_strategies:
  combo: configs/strategies/combo.yaml
  ma_cross: configs/strategies/ma_cross.yaml
  ai_trend: configs/strategies/ai_trend.yaml

available_presets:
  combo_ctrader_v0: configs/presets/combo_ctrader_v0.yaml
  combo_research: configs/presets/combo_research.yaml
  ma_cross_research: configs/presets/ma_cross_research.yaml
  ai_trend_research: configs/presets/ai_trend_research.yaml

available_grids:
  combo_ctrader_v0: configs/presets/combo_ctrader_v0_grid.yaml
  generic_research: configs/param_grids.yaml

market_spec:
  pip_size: 0.0001
  pip_value_per_lot: 10.0
  min_lot: 0.01
  lot_step: 0.01
  commission_per_lot_per_side: 0.0
  spread_buffer_pips: 0.0
  slippage_buffer_pips: 0.0

per_symbol_market_spec: {}
