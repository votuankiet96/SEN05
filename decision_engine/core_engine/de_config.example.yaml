      EURUSD: {M10: H1, M20: H1, M30: H1, M45: H3, H1: H1, H2: H2, H3: H3, H4: H4}
      GBPUSD: {M10: H1, M20: H1, M30: H1, M45: H2, H1: H2, H2: H2, H3: H4, H4: H4}
      USDCAD: {M10: H1, M20: H1, M30: H1, M45: H2, H1: H2, H2: H4, H3: H4, H4: H4}
      USDJPY: {M10: H1, M20: H1, M30: H1, M45: H1, H1: H1, H2: H4, H3: H4, H4: H4}
      FR40: {M10: H1, M20: H1, M30: H1, M45: H2, H1: H2, H2: H4, H3: H3, H4: H4}
      SP35: {M10: H1, M20: H1, M30: H1, M45: H1, H1: H2, H2: H3, H3: H4, H4: H4}
      UK100: {M10: H1, M20: H1, M30: H1, M45: H1, H1: H1, H2: H3, H3: H3, H4: H4}
