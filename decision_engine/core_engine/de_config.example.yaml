    macd_fast: 5
    macd_slow: 25
    macd_signal: 5
    atr_period: 5
    supported_timeframes: [M10, M20, M30, M45, H1, H2, H3, H4]
    trend_methods: [knn]          # khối lọc mặc định (nguồn knn); breakout/zigzag/tstat/cloud được chọn riêng theo redis.trend_outputs
    trend_timeframes: [H1, H2, H3, H4]
    trend_off_timeframes: []   # khung KHÔNG lọc trend ([] = lọc trend ở mọi khung): macd_break dùng lại lọc trend ở MỌI khung từ 2026-10-28 (đồng bộ we_core/des)
    excluded_trend_methods: [breakout]   # khối trend KHÔNG áp cho macd_break ở mọi khung: breakout tính hướng bằng chính điều kiện phá đỉnh/đáy + MACD của macd_break (lọc vòng tròn)
