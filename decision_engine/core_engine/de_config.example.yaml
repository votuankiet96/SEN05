    trend_methods: [knn]          # khối lọc mặc định (nguồn knn); breakout/zigzag/tstat/cloud được chọn riêng theo redis.trend_outputs
    trend_timeframes: [H1, H2, H3, H4]
    trend_tf_by_symbol:   # khung trend riêng từng (symbol, khung vào lệnh), BẮT BUỘC đủ ô; chép từ we_core (tên symbol theo AEN)
      US30: {H1: H4, H2: H2, H3: H3, H4: H4}
      US500: {H1: H4, H2: H2, H3: H3, H4: H4}
