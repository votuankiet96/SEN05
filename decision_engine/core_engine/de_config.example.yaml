  ichimoku:
    tenkan_period: 9          # Tenkan-sen = (đỉnh cao nhất + đáy thấp nhất) / 2 của N nến gần nhất
    kijun_period: 26          # Kijun-sen, cùng công thức với N nến
    senkou_b_period: 52       # Senkou Span B, cùng công thức với N nến
    displacement: 26          # mây tại nến t = Senkou tính ở nến t - N; Chikou: so close với close N nến trước
    atr_period: 5
    supported_timeframes: [M10, M20, M30, M45, H1, H2, H3, H4]
    alternating_filter_enabled: true   # true = chi ban tin hieu dau tien khi huong doi chieu (loc lap cung chieu); false = bar nao thoa dieu kien cung ban
