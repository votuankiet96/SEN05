redis:
  enabled: true
  host: "127.0.0.1"       # Redis replica AEN trên og18: DB0 nến vào, DB1 tín hiệu ra
  password: ""
  input:
    db: 0
    key_prefix: "L_CANDLE"
    snapshot_bars: 500
    process_on_startup: true
    # NHÓM symbols × khung mà DE làm việc (AEN đẩy tới db0) -- nơi khai DUY NHẤT của nguồn Core AEN (symbol của nguồn nến thêm khai ở `input_sources` bên dưới; hợp hai nơi là danh sách mà bảng khung trend của chiến lược phải phủ). Cặp ngoài nhóm bị bỏ ở cửa;
    # cái gì khai ở đây mà AEN không có thì coi như không có (không event nào tới), nên khai cho KHỚP đúng cái AEN đang đẩy lên db0.
    symbols: [US30, US500, US100, GER40, HK50, JP225, XAUUSD, BTCUSD]   # symbol vận hành của CẢ 5 chiến lược (tên theo nguồn nến AEN); bảng khung trend của mỗi chiến lược phải đủ ô cho từng symbol
    timeframes: [M10, M20, M30, M45, H1, H2, H3, H4]                    # phải bao các khung vào lệnh và khung trend của mọi chiến lược
  # Nguồn nến THÊM: một Redis khác cùng bố cục nến (LIST+HASH) nuôi các symbol mà nguồn mặc định `input` không có (vd Redis DF trên OG8, cổng 6380, db0, nuôi 7 symbol). Mỗi nguồn một NHÓM
  # tiến trình riêng (de-signal@<chiến lược>.og8, de-trend@<khối>.og8) nên nguồn mất kết nối chỉ làm nhóm đó dừng. Khoá không khai ở đây (timeframes, snapshot_bars, process_on_startup...)
  # kế thừa `input`. Mỗi symbol chỉ thuộc MỘT nguồn. Đầu ra (db raw, trend, lọc) vẫn ở Redis của DE (`output`), khoá có tên symbol nên không đụng nhau. Bỏ cả mục này = chỉ chạy nguồn `input`.
  input_sources:
    og8:
      host: "10.11.12.8"
      port: 6380
      password: ""                # mật khẩu Redis của nguồn; "" = không AUTH
      db: 0
      key_prefix: "L_CANDLE"
      symbols: [EURUSD, GBPUSD, USDCAD, USDJPY, FR40, SP35, UK100]   # tên symbol theo nguồn nến OG8; bảng khung trend của mỗi chiến lược phải đủ ô cho từng symbol
  output:
    db: 0                         # Tín hiệu RAW của strategy_runner (cổng 6380): LIST L_DE_{STRATEGY}_{SYMBOL}_{TF} + HASH <LIST>:{giờ mở}
    port: 6380                    # Redis đầu ra của DE (cùng host); nến DB0 vẫn đọc từ port gốc 6379
    password: ""                  # mật khẩu của instance output (có thể khác password gốc); "" = không AUTH
    key_prefix: "L_DE"           # DE LIST/HASH: L_DE_{STRATEGY}_{SYMBOL}_{TF}[:stamp]
    channel_prefix: "L_CHANNEL"   # Kênh Pub/Sub DE -> OF (chỉ là đường truyền, không lưu key nào): L_CHANNEL_{STRATEGY}_{SYMBOL}_{TF}
  trend_output:                   # Kết quả trend của trend_filtering (cùng Redis cổng 6380 với `output`, db riêng): LIST L_TREND_{KHỐI}_{SYMBOL}_{KHUNG} + HASH <LIST>:{giờ mở nến trend}
    db: 1
    key_prefix: "L_TREND"
  filtered_output:                # Tín hiệu ĐÃ LỌC trend do tiến trình chiến lược ghi (cùng Redis cổng 6380, mật khẩu và thời hạn lưu với `output`, db riêng): LIST/HASH và kênh Pub/Sub theo tiền tố từng khối ở `trend_outputs`
    db: 2
  # Các nguồn LỌC TREND (2026-10-25), giống DB1 / DB2 / DB4 của we_core: cùng Redis/DB/mật khẩu/thời hạn lưu với `output`, mỗi nguồn một cặp tiền tố riêng
  # (LIST/HASH và kênh Pub/Sub). Nguồn nào không khai ở đây thì không được tính. Nguồn không lọc (raw) là `output` ở trên, giữ nguyên tên.
  trend_outputs:
    knn:      {key_prefix: "L_DE_KNN",      channel_prefix: "L_CHANNEL_KNN"}
    breakout: {key_prefix: "L_DE_BREAKOUT", channel_prefix: "L_CHANNEL_BREAKOUT"}
    zigzag:   {key_prefix: "L_DE_ZIGZAG",   channel_prefix: "L_CHANNEL_ZIGZAG"}
    tstat:    {key_prefix: "L_DE_TSTAT",    channel_prefix: "L_CHANNEL_TSTAT"}
    cloud:    {key_prefix: "L_DE_CLOUD",    channel_prefix: "L_CHANNEL_CLOUD"}

live:
  enabled_strategies: [combo, ma_cross, macd_break, ichimoku, ema_reach]
  log_level: INFO
  price_decimals: {EURUSD: 5, GBPUSD: 5, USDCAD: 5, USDJPY: 3}   # số lẻ làm tròn entry/atr của tín hiệu; symbol không khai = 2 (chỉ số, vàng, BTC). Forex làm tròn 2 số lẻ sẽ hỏng giá
  signal_validity:
    combo:
      mode: next_bar
      valid_bars: 3
    ma_cross:
      mode: seconds_after_bar_close
      seconds: 600  # AEN M45 (dong luc :15/:45) ghi cham deu ~310-373s -- 180s cu qua ngan
    macd_break:
      mode: seconds_after_bar_close   # lenh MARKET (entry = close) nhu ma_cross: chi hieu luc ngan sau khi nen dong
      seconds: 600
    ichimoku:
      mode: seconds_after_bar_close   # lenh MARKET (entry = close) nhu ma_cross: chi hieu luc ngan sau khi nen dong
      seconds: 600
    ema_reach:
      mode: seconds_after_bar_close   # lenh MARKET (entry = close) nhu ma_cross: chi hieu luc ngan sau khi nen dong
      seconds: 600

